<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    },
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: '100%',
                                pre: {
                                    backgroundColor: '#1f2937',
                                    color: '#f8fafc',
                                    borderRadius: '0.75rem',
                                    padding: '1rem',
                                },
                                code: {
                                    color: '#ef4444',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    padding: '0.2rem 0.4rem',
                                    borderRadius: '0.25rem',
                                    fontWeight: '500',
                                },
                                'code::before': { content: '""' },
                                'code::after': { content: '""' }
                            }
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Base Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* Hide scrollbar for textarea */
        textarea::-webkit-scrollbar { display: none; }
        textarea { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth transitions */
        .transition-theme { transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* Typing indicator cursor */
        .generating .message-content > *:last-child::after {
            content: '▋';
            display: inline-block;
            vertical-align: text-bottom;
            animation: blink 1s step-start infinite;
            margin-left: 4px;
            color: #3b82f6;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* Markdown override fixes */
        .prose p:last-child { margin-bottom: 0; }
    </style>
</head>
<body class="min-h-screen flex bg-gray-50 text-gray-800 transition-theme dark:bg-gray-950 dark:text-gray-100">

    <div id="loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white dark:bg-gray-950">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-gray-600 dark:text-gray-300 font-medium">Loading Workspace...</p>
    </div>

    <div id="app" class="hidden flex-1 flex w-full min-h-screen relative">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-gray-100 dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 flex flex-col">
            <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800">
                <button id="new-chat-btn" class="flex-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 px-4 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 transition-colors shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Chat
                </button>
                <button id="close-sidebar-btn" class="md:hidden ml-2 p-2 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chat-list">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800">
                <button id="open-settings-btn" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity"></div>

        <main class="flex-1 flex flex-col min-w-0 h-full relative">
            
            <header class="sticky top-0 z-20 flex items-center justify-between px-4 h-14 bg-white/80 dark:bg-gray-950/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
                <div class="flex items-center gap-3">
                    <button id="open-sidebar-btn" class="md:hidden p-2 -ml-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="font-semibold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400">Universal AI</h1>
                </div>
                <button id="theme-toggle" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors" title="Toggle Dark Mode">
                    <svg id="theme-icon-dark" class="w-5 h-5 hidden dark:block text-yellow-300" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 4.22a1 1 0 011.415 0l.708.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM14.95 15.657a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zm-4.22-4.22a1 1 0 00-1.415 0l-.708.707a1 1 0 001.414 1.414l.707-.707a1 1 0 000-1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm3.05-5.657a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707zM10 5a5 5 0 100 10 5 5 0 000-10z"></path></svg>
                    <svg id="theme-icon-light" class="w-5 h-5 block dark:hidden text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
            </header>

            <div id="chat-container" class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 pb-28 space-y-8 overflow-y-auto">
                <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center mt-10 space-y-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-gray-800 to-gray-500 dark:from-gray-100 dark:to-gray-400">How can I help you today?</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">Access state-of-the-art models via OpenRouter. Enter your API key in settings to begin.</p>
                </div>
                </div>

            <div class="sticky bottom-0 w-full z-10 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent dark:from-gray-950 dark:via-gray-950 pt-8 pb-4 px-4 md:px-8">
                <div class="max-w-4xl mx-auto relative bg-white dark:bg-gray-850 rounded-3xl shadow-[0_0_20px_rgba(0,0,0,0.05)] dark:shadow-[0_0_20px_rgba(0,0,0,0.3)] border border-gray-200 dark:border-gray-700 flex items-end p-2 transition-colors duration-200">
                    <textarea id="user-input" rows="1" class="w-full resize-none bg-transparent outline-none max-h-40 overflow-y-auto py-3 px-4 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 text-base" placeholder="Message AI..."></textarea>
                    <button id="send-btn" class="p-3 mb-1 mr-1 rounded-full bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shrink-0 flex items-center justify-center shadow-sm">
                        <svg class="w-5 h-5 translate-x-px -translate-y-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
                <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500">
                    AI can make mistakes. Consider verifying important information.
                </div>
            </div>

        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-800">
                <h3 class="text-xl font-semibold">Settings</h3>
                <button id="close-settings-btn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-5 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" placeholder="sk-or-v1-..." class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800 dark:text-gray-100 transition-colors">
                    <p class="text-xs text-gray-500 mt-1">Stored securely in your browser's local storage.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model Name</label>
                    <input type="text" id="model-input" placeholder="deepseek/deepseek-r1:free" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800 dark:text-gray-100 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">System Prompt</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800 dark:text-gray-100 resize-none transition-colors" placeholder="You are a helpful AI assistant."></textarea>
                </div>
            </div>
            <div class="p-5 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-850 flex justify-end">
                <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-medium transition-colors shadow-sm">Save Preferences</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==========================================
            // STATE MANAGEMENT
            // ==========================================
            const STATE = {
                chats: [],
                currentChatId: null,
                settings: {
                    apiKey: '',
                    model: 'deepseek/deepseek-r1:free',
                    systemPrompt: 'You are a helpful and intelligent AI assistant.',
                    theme: 'system' // 'dark', 'light', 'system'
                },
                isGenerating: false
            };

            // ==========================================
            // DOM ELEMENTS
            // ==========================================
            const DOM = {
                loading: document.getElementById('loading'),
                app: document.getElementById('app'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                chatContainer: document.getElementById('chat-container'),
                welcomeScreen: document.getElementById('welcome-screen'),
                chatList: document.getElementById('chat-list'),
                userInput: document.getElementById('user-input'),
                sendBtn: document.getElementById('send-btn'),
                
                // Buttons
                newChatBtn: document.getElementById('new-chat-btn'),
                openSidebarBtn: document.getElementById('open-sidebar-btn'),
                closeSidebarBtn: document.getElementById('close-sidebar-btn'),
                themeToggle: document.getElementById('theme-toggle'),
                openSettingsBtn: document.getElementById('open-settings-btn'),
                
                // Modal
                settingsModal: document.getElementById('settings-modal'),
                closeSettingsBtn: document.getElementById('close-settings-btn'),
                saveSettingsBtn: document.getElementById('save-settings-btn'),
                apiKeyInput: document.getElementById('api-key-input'),
                modelInput: document.getElementById('model-input'),
                systemPromptInput: document.getElementById('system-prompt-input'),
            };

            // ==========================================
            // INITIALIZATION
            // ==========================================
            function init() {
                loadData();
                applyTheme();
                
                if (STATE.chats.length === 0) {
                    createNewChat();
                } else {
                    if (!STATE.chats.find(c => c.id === STATE.currentChatId)) {
                        STATE.currentChatId = STATE.chats[0].id;
                    }
                    renderChatList();
                    renderMessages();
                }

                setupEventListeners();

                // Configure marked.js options for safety and formatting
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });

                // Remove loader
                setTimeout(() => {
                    DOM.loading.style.display = 'none';
                    DOM.app.classList.remove('hidden');
                    adjustTextareaHeight();
                }, 300);
            }

            // ==========================================
            // UTILITIES
            // ==========================================
            function generateId() {
                return (typeof crypto !== 'undefined' && crypto.randomUUID) 
                    ? crypto.randomUUID() 
                    : 'id-' + Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            function loadData() {
                try {
                    const savedSettings = localStorage.getItem('ai_settings');
                    if (savedSettings) STATE.settings = { ...STATE.settings, ...JSON.parse(savedSettings) };
                    
                    const savedChats = localStorage.getItem('ai_chats');
                    if (savedChats) STATE.chats = JSON.parse(savedChats);
                    
                    const savedCurrentChat = localStorage.getItem('ai_current_chat');
                    if (savedCurrentChat) STATE.currentChatId = savedCurrentChat;
                } catch (e) {
                    console.error("Failed to load data from localStorage", e);
                }
            }

            function saveData() {
                try {
                    localStorage.setItem('ai_settings', JSON.stringify(STATE.settings));
                    localStorage.setItem('ai_chats', JSON.stringify(STATE.chats));
                    localStorage.setItem('ai_current_chat', STATE.currentChatId);
                } catch (e) {
                    console.error("Failed to save data to localStorage", e);
                }
            }

            // ==========================================
            // THEME MANAGEMENT
            // ==========================================
            function applyTheme() {
                const isDark = STATE.settings.theme === 'dark' || 
                    (STATE.settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            function toggleTheme() {
                const isCurrentlyDark = document.documentElement.classList.contains('dark');
                STATE.settings.theme = isCurrentlyDark ? 'light' : 'dark';
                applyTheme();
                saveData();
            }

            // ==========================================
            // CHAT MANAGEMENT
            // ==========================================
            function createNewChat() {
                const newChat = {
                    id: generateId(),
                    title: 'New Chat',
                    messages: []
                };
                STATE.chats.unshift(newChat);
                STATE.currentChatId = newChat.id;
                saveData();
                renderChatList();
                renderMessages();
                
                // Close sidebar on mobile after new chat
                if (window.innerWidth < 768) toggleSidebar(false);
            }

            function getCurrentChat() {
                return STATE.chats.find(c => c.id === STATE.currentChatId);
            }

            function deleteChat(id, event) {
                event.stopPropagation();
                if(!confirm("Are you sure you want to delete this chat?")) return;
                
                STATE.chats = STATE.chats.filter(c => c.id !== id);
                if (STATE.chats.length === 0) {
                    createNewChat();
                } else if (STATE.currentChatId === id) {
                    STATE.currentChatId = STATE.chats[0].id;
                }
                saveData();
                renderChatList();
                renderMessages();
            }

            function renameChat(id, event) {
                event.stopPropagation();
                const chat = STATE.chats.find(c => c.id === id);
                if(!chat) return;
                
                const newTitle = prompt("Enter new name for this chat:", chat.title);
                if (newTitle && newTitle.trim() !== '') {
                    chat.title = newTitle.trim();
                    saveData();
                    renderChatList();
                }
            }

            function switchChat(id) {
                if(STATE.isGenerating) return;
                STATE.currentChatId = id;
                saveData();
                renderChatList();
                renderMessages();
                if (window.innerWidth < 768) toggleSidebar(false);
            }

            // ==========================================
            // RENDERING
            // ==========================================
            function renderChatList() {
                DOM.chatList.innerHTML = '';
                STATE.chats.forEach(chat => {
                    const isActive = chat.id === STATE.currentChatId;
                    const div = document.createElement('div');
                    
                    div.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`;
                    
                    div.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden flex-1" onclick="window.appAPI.switchChat('${chat.id}')">
                            <svg class="w-4 h-4 flex-shrink-0 ${isActive ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                            <span class="truncate text-sm font-medium select-none">${escapeHTML(chat.title)}</span>
                        </div>
                        <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="p-1.5 text-gray-400 hover:text-blue-500" onclick="window.appAPI.renameChat('${chat.id}', event)" title="Rename">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button class="p-1.5 text-gray-400 hover:text-red-500" onclick="window.appAPI.deleteChat('${chat.id}', event)" title="Delete">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    DOM.chatList.appendChild(div);
                });
            }

            function renderMessages() {
                const chat = getCurrentChat();
                if (!chat) return;

                // Clear existing
                Array.from(DOM.chatContainer.children).forEach(child => {
                    if (child.id !== 'welcome-screen') child.remove();
                });

                if (chat.messages.length === 0) {
                    DOM.welcomeScreen.classList.remove('hidden');
                } else {
                    DOM.welcomeScreen.classList.add('hidden');
                    chat.messages.forEach(msg => {
                        appendMessageDOM(msg.id, msg.role, msg.content, false);
                    });
                    scrollToBottom();
                }
            }

            function appendMessageDOM(id, role, content, isGenerating = false) {
                const div = document.createElement('div');
                div.id = `msg-${id}`;
                div.className = `flex w-full animate-fade-in ${role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                if (role === 'user') {
                    div.innerHTML = `
                        <div class="bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 px-5 py-3.5 rounded-3xl rounded-tr-sm max-w-[85%] sm:max-w-[75%] shadow-sm whitespace-pre-wrap font-medium">
                            ${escapeHTML(content)}
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="flex max-w-full min-w-0 ${isGenerating ? 'generating' : ''}">
                            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-blue-100 to-purple-100 dark:from-blue-900/40 dark:to-purple-900/40 flex items-center justify-center mr-4 flex-shrink-0 mt-1 shadow-sm border border-blue-200 dark:border-blue-800/50">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                            <div class="message-content prose prose-slate dark:prose-invert max-w-[85%] sm:max-w-[85%] overflow-hidden break-words text-[15px] sm:text-base leading-relaxed">
                                ${marked.parse(content || '\u200B')}
                            </div>
                        </div>
                    `;
                }
                
                DOM.chatContainer.appendChild(div);
            }

            function updateMessageDOM(id, content, isGenerating) {
                const msgEl = document.getElementById(`msg-${id}`);
                if (!msgEl) return;
                
                const contentEl = msgEl.querySelector('.message-content');
                if(contentEl) {
                    contentEl.innerHTML = marked.parse(content || '\u200B');
                }
                
                const wrapper = msgEl.querySelector('.flex.max-w-full');
                if (wrapper) {
                    if (isGenerating) wrapper.classList.add('generating');
                    else wrapper.classList.remove('generating');
                }
            }

            // ==========================================
            // LOGIC & API STREAMING
            // ==========================================
            async function sendMessage() {
                if (STATE.isGenerating) return;
                
                const text = DOM.userInput.value.trim();
                if (!text) return;
                
                if (!STATE.settings.apiKey) {
                    alert("Please enter your OpenRouter API Key in Settings first.");
                    openSettings();
                    return;
                }

                DOM.userInput.value = '';
                adjustTextareaHeight();
                DOM.welcomeScreen.classList.add('hidden');

                const chat = getCurrentChat();
                
                // Add User Message
                const userMsg = { id: generateId(), role: 'user', content: text };
                chat.messages.push(userMsg);
                appendMessageDOM(userMsg.id, 'user', text);
                
                // Add Assistant Placeholder
                const aiMsgId = generateId();
                const aiMsg = { id: aiMsgId, role: 'assistant', content: '' };
                chat.messages.push(aiMsg);
                appendMessageDOM(aiMsgId, 'assistant', '', true);
                
                scrollToBottom();

                // Auto-generate title if it's the first message
                if (chat.messages.length === 2 && chat.title === 'New Chat') {
                    chat.title = text.length > 30 ? text.substring(0, 30) + '...' : text;
                    renderChatList();
                }

                STATE.isGenerating = true;
                updateUIState();

                try {
                    const apiMessages = [
                        { role: 'system', content: STATE.settings.systemPrompt },
                        ...chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }))
                    ];

                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${STATE.settings.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: STATE.settings.model || 'deepseek/deepseek-r1:free',
                            messages: apiMessages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `HTTP Error ${response.status}`);
                    }

                    await processStream(response.body.getReader(), aiMsgId);
                } catch (error) {
                    console.error("API Error:", error);
                    const errorText = `**Error:** ${error.message}\n\nPlease check your API key and network connection.`;
                    aiMsg.content = errorText;
                    updateMessageDOM(aiMsgId, errorText, false);
                } finally {
                    STATE.isGenerating = false;
                    updateUIState();
                    updateMessageDOM(aiMsgId, aiMsg.content, false); // Remove generating cursor
                    saveData();
                }
            }

            async function processStream(reader, messageId) {
                const decoder = new TextDecoder('utf-8');
                const chat = getCurrentChat();
                const aiMsg = chat.messages.find(m => m.id === messageId);
                let buffer = "";

                // Scroll state vars
                let lastScrollTop = window.scrollY || document.documentElement.scrollTop;
                let isUserScrollingUp = false;

                // Watch for user scroll
                const scrollHandler = () => {
                    const currentScroll = window.scrollY || document.documentElement.scrollTop;
                    if (currentScroll < lastScrollTop - 10) {
                        isUserScrollingUp = true;
                    }
                    lastScrollTop = currentScroll;
                };
                window.addEventListener('scroll', scrollHandler, { passive: true });

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed.startsWith(':')) continue;
                            if (trimmed === 'data: [DONE]') return;

                            if (trimmed.startsWith('data: ')) {
                                const dataStr = trimmed.slice(6);
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    const content = parsed.choices[0]?.delta?.content || "";
                                    
                                    if (content) {
                                        aiMsg.content += content;
                                        updateMessageDOM(messageId, aiMsg.content, true);
                                        
                                        // Auto-scroll logic if user hasn't scrolled up manually
                                        if (!isUserScrollingUp) {
                                            scrollToBottom();
                                        }
                                    }
                                } catch (e) {
                                    // Silent ignore parsing errors for partial JSON in chunks
                                }
                            }
                        }
                    }
                } finally {
                    window.removeEventListener('scroll', scrollHandler);
                }
            }

            // ==========================================
            // UI INTERACTION & HELPERS
            // ==========================================
            function toggleSidebar(forceState) {
                const isOpen = typeof forceState === 'boolean' ? forceState : DOM.sidebar.classList.contains('-translate-x-full');
                if (isOpen) {
                    DOM.sidebar.classList.remove('-translate-x-full');
                    DOM.sidebarOverlay.classList.remove('hidden');
                    setTimeout(() => DOM.sidebarOverlay.classList.remove('opacity-0'), 10);
                } else {
                    DOM.sidebar.classList.add('-translate-x-full');
                    DOM.sidebarOverlay.classList.add('opacity-0');
                    setTimeout(() => DOM.sidebarOverlay.classList.add('hidden'), 300);
                }
            }

            function openSettings() {
                DOM.apiKeyInput.value = STATE.settings.apiKey;
                DOM.modelInput.value = STATE.settings.model;
                DOM.systemPromptInput.value = STATE.settings.systemPrompt;
                
                DOM.settingsModal.classList.remove('hidden');
                // Trigger reflow
                void DOM.settingsModal.offsetWidth;
                DOM.settingsModal.classList.remove('opacity-0');
                DOM.settingsModal.querySelector('div').classList.remove('scale-95');
            }

            function closeSettings() {
                DOM.settingsModal.classList.add('opacity-0');
                DOM.settingsModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => DOM.settingsModal.classList.add('hidden'), 300);
            }

            function saveSettings() {
                STATE.settings.apiKey = DOM.apiKeyInput.value.trim();
                STATE.settings.model = DOM.modelInput.value.trim() || 'deepseek/deepseek-r1:free';
                STATE.settings.systemPrompt = DOM.systemPromptInput.value.trim();
                saveData();
                closeSettings();
            }

            function adjustTextareaHeight() {
                DOM.userInput.style.height = 'auto';
                DOM.userInput.style.height = (DOM.userInput.scrollHeight) + 'px';
            }

            function updateUIState() {
                DOM.sendBtn.disabled = STATE.isGenerating || DOM.userInput.value.trim() === '';
                DOM.sendBtn.innerHTML = STATE.isGenerating 
                    ? `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
                    : `<svg class="w-5 h-5 translate-x-px -translate-y-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>`;
            }

            function scrollToBottom() {
                // Because of our layout, scrolling the window/document body handles the scroll
                window.scrollTo({
                    top: document.documentElement.scrollHeight,
                    behavior: 'smooth'
                });
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag] || tag)
                );
            }

            // ==========================================
            // EVENT LISTENERS BINDING
            // ==========================================
            function setupEventListeners() {
                DOM.newChatBtn.addEventListener('click', createNewChat);
                DOM.openSidebarBtn.addEventListener('click', () => toggleSidebar(true));
                DOM.closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
                DOM.sidebarOverlay.addEventListener('click', () => toggleSidebar(false));
                DOM.themeToggle.addEventListener('click', toggleTheme);
                DOM.openSettingsBtn.addEventListener('click', openSettings);
                DOM.closeSettingsBtn.addEventListener('click', closeSettings);
                DOM.saveSettingsBtn.addEventListener('click', saveSettings);
                DOM.sendBtn.addEventListener('click', sendMessage);

                // Textarea auto-resize and Enter to send
                DOM.userInput.addEventListener('input', () => {
                    adjustTextareaHeight();
                    updateUIState();
                });

                DOM.userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });

                // Global API binding for inline HTML handlers
                window.appAPI = { switchChat, deleteChat, renameChat };
            }

            // BOOT
            init();
        });
    </script>
</body>
</html>
