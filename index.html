<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Universal Light Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#f8fafc', // Slate 50
                        surface: '#ffffff',    // White
                        primary: '#2563eb',    // Blue 600
                        secondary: '#64748b',  // Slate 500
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'message-pop': 'messagePop 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out'
                    },
                    keyframes: {
                        messagePop: {
                            '0%': { opacity: 0, transform: 'translateY(20px) scale(0.95)' },
                            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' }
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for Light Theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Markdown Styles */
        .prose pre { margin: 0; padding: 1rem; background: #f1f5f9; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.875rem; color: #dc2626; }
        .prose pre code { color: #334155; }
        
        /* Loading Animation */
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body class="bg-background text-slate-800 h-screen flex overflow-hidden font-sans selection:bg-blue-100 selection:text-blue-900">

    <aside id="sidebar" class="w-72 bg-surface border-r border-slate-200 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0 shadow-lg md:shadow-none">
        <div class="p-4 flex items-center justify-between border-b border-slate-100">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center shadow-md">
                    <i class="ph-bold ph-chats-circle text-lg"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-800">Nexus<span class="text-primary">Chat</span></span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800"><i class="ph ph-x text-xl"></i></button>
        </div>

        <div class="p-3">
            <button onclick="app.startNewChat()" class="w-full flex items-center gap-2 px-4 py-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl transition-all group font-medium shadow-sm">
                <i class="ph-bold ph-plus text-primary"></i>
                <span>নতুন চ্যাট শুরু করুন</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="history-container">
            </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <button onclick="ui.openModal('settings-modal')" class="flex items-center gap-3 w-full p-2.5 rounded-lg hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200 transition-all text-slate-600">
                <i class="ph-duotone ph-gear-six text-xl"></i>
                <div class="text-left flex-1">
                    <div class="text-sm font-semibold">সেটিংস ও API</div>
                    <div class="text-[10px] text-slate-500">Key ম্যানেজমেন্ট</div>
                </div>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full bg-background">
        
        <header class="h-16 border-b border-slate-200 flex items-center justify-between px-4 md:px-6 bg-surface/90 backdrop-blur-md z-10 sticky top-0 shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 p-1 rounded-md hover:bg-slate-100"><i class="ph ph-list text-2xl"></i></button>
                
                <div class="relative group">
                    <button onclick="document.getElementById('api-dropdown').classList.toggle('hidden')" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-primary transition-colors bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span id="current-api-name">Select API</span>
                        <i class="ph-bold ph-caret-down"></i>
                    </button>
                    <div id="api-dropdown" class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden py-1 z-50">
                        <div id="api-list-container">
                            </div>
                        <div class="border-t border-slate-100 mt-1 pt-1">
                             <button onclick="ui.openModal('settings-modal'); document.getElementById('api-dropdown').classList.add('hidden')" class="w-full text-left px-4 py-2 text-xs font-semibold text-primary hover:bg-slate-50 flex items-center gap-2">
                                <i class="ph-bold ph-plus"></i> নতুন API যোগ করুন
                             </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="app.clearChat()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Clear Context"><i class="ph ph-trash text-lg"></i></button>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center opacity-70">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-6">
                    <i class="ph-duotone ph-robot text-4xl text-primary"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Nexus এ স্বাগতম</h2>
                <p class="text-sm text-slate-500 mt-2 text-center max-w-md">আপনার সেভ করা API সিলেক্ট করুন এবং চ্যাট শুরু করুন।<br>আনলিমিটেড কনভারসেশন।</p>
                <button onclick="ui.openModal('settings-modal')" class="mt-6 px-6 py-2.5 bg-slate-800 text-white rounded-full text-sm font-medium hover:bg-slate-700 shadow-lg transition-transform hover:scale-105">
                    API Key সেট করুন
                </button>
            </div>
        </div>

        <div class="p-4 md:p-6 bg-surface border-t border-slate-200">
            <div class="max-w-4xl mx-auto relative bg-slate-50 border border-slate-300 rounded-3xl shadow-sm focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
                <textarea id="user-input" rows="1" class="w-full bg-transparent text-base text-slate-800 placeholder-slate-400 px-5 py-4 pr-14 outline-none resize-none max-h-[50vh]" placeholder="এখানে আপনার প্রশ্ন লিখুন... (যত খুশি তত বড়)" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                
                <button id="send-btn" onclick="app.sendMessage()" class="absolute right-2 bottom-2 p-2.5 bg-primary hover:bg-blue-700 text-white rounded-2xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                    <i class="ph-bold ph-paper-plane-right text-lg"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-[10px] text-slate-400">AI ভুল করতে পারে। গুরুত্বপূর্ণ তথ্য যাচাই করুন।</p>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 text-lg"><i class="ph-bold ph-sliders"></i> API কনফিগারেশন</h3>
                <button onclick="ui.closeModal('settings-modal')" class="text-slate-400 hover:text-slate-800"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-8">
                
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 space-y-4">
                    <h4 class="text-sm font-bold text-primary uppercase tracking-wider">নতুন API যোগ করুন</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">API-এর নাম (Display Name)</label>
                            <input type="text" id="new-api-name" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="যেমন: My Gemini Pro">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Model ID</label>
                            <input type="text" id="new-api-model" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="যেমন: google/gemini-pro-1.5">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Base URL (ঐচ্ছিক)</label>
                        <input type="text" id="new-api-url" value="https://openrouter.ai/api/v1" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="Default: https://openrouter.ai/api/v1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">API Key</label>
                        <input type="password" id="new-api-key" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="sk-...">
                    </div>
                    <button onclick="app.addProfile()" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg transition-all shadow-sm">সেভ করুন</button>
                </div>

                <div>
                    <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">সেভ করা API সমূহ</h4>
                    <div id="saved-profiles-list" class="space-y-2">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * NEXUS LIGHT - LOGIC
         */

        const DOM = {
            input: document.getElementById('user-input'),
            chatContainer: document.getElementById('chat-container'),
            historyContainer: document.getElementById('history-container'),
            welcomeScreen: document.getElementById('welcome-screen'),
            currentApiName: document.getElementById('current-api-name'),
            sendBtn: document.getElementById('send-btn'),
            apiListContainer: document.getElementById('api-list-container'),
            savedProfilesList: document.getElementById('saved-profiles-list')
        };

        // State Management
        const store = {
            profiles: [], // Array of API objects
            activeProfileId: null,
            chats: [],
            activeChatId: null,
            isGenerating: false
        };

        const app = {
            init: () => {
                // Load Data
                const savedProfiles = localStorage.getItem('nexus_profiles');
                const savedChats = localStorage.getItem('nexus_chats');
                const lastProfileId = localStorage.getItem('nexus_active_profile');

                if (savedProfiles) store.profiles = JSON.parse(savedProfiles);
                if (savedChats) store.chats = JSON.parse(savedChats);
                
                // Set Active Profile
                if (store.profiles.length > 0) {
                    store.activeProfileId = lastProfileId ? parseInt(lastProfileId) : store.profiles[0].id;
                    // Validate if ID still exists
                    if (!store.profiles.find(p => p.id === store.activeProfileId)) {
                        store.activeProfileId = store.profiles[0].id;
                    }
                }

                app.updateApiUI();
                ui.renderHistory();

                if (store.chats.length > 0) {
                    app.loadChat(store.chats[0].id);
                } else {
                    app.startNewChat();
                }

                // Input Listener
                DOM.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        app.sendMessage();
                    }
                });

                // Close dropdown when clicking outside
                document.addEventListener('click', (e) => {
                    const dropdown = document.getElementById('api-dropdown');
                    const btn = document.querySelector('button[onclick*="api-dropdown"]');
                    if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });

                if(store.profiles.length === 0) ui.openModal('settings-modal');
            },

            saveState: () => {
                localStorage.setItem('nexus_profiles', JSON.stringify(store.profiles));
                localStorage.setItem('nexus_chats', JSON.stringify(store.chats));
                localStorage.setItem('nexus_active_profile', store.activeProfileId);
                app.updateApiUI();
                ui.renderHistory();
            },

            // --- API PROFILE MANAGEMENT ---

            addProfile: () => {
                const name = document.getElementById('new-api-name').value.trim();
                const key = document.getElementById('new-api-key').value.trim();
                const model = document.getElementById('new-api-model').value.trim();
                let url = document.getElementById('new-api-url').value.trim();

                if (!name || !key || !model) {
                    alert("দয়া করে নাম, মডেল এবং API Key পূরণ করুন।");
                    return;
                }
                
                if(!url) url = "https://openrouter.ai/api/v1";

                const newProfile = {
                    id: Date.now(),
                    name,
                    key,
                    model,
                    baseUrl: url
                };

                store.profiles.push(newProfile);
                store.activeProfileId = newProfile.id;
                
                // Clear inputs
                document.getElementById('new-api-name').value = '';
                document.getElementById('new-api-key').value = '';
                document.getElementById('new-api-model').value = '';
                
                app.saveState();
                // ui.closeModal('settings-modal'); // Keep open to see list
            },

            deleteProfile: (id) => {
                if(confirm("আপনি কি এই API টি মুছে ফেলতে চান?")) {
                    store.profiles = store.profiles.filter(p => p.id !== id);
                    if (store.activeProfileId === id && store.profiles.length > 0) {
                        store.activeProfileId = store.profiles[0].id;
                    } else if (store.profiles.length === 0) {
                        store.activeProfileId = null;
                    }
                    app.saveState();
                }
            },

            selectProfile: (id) => {
                store.activeProfileId = id;
                app.saveState();
                document.getElementById('api-dropdown').classList.add('hidden');
            },

            updateApiUI: () => {
                // Header Display
                const active = store.profiles.find(p => p.id === store.activeProfileId);
                DOM.currentApiName.innerText = active ? active.name : "No API Selected";

                // Dropdown List
                DOM.apiListContainer.innerHTML = store.profiles.map(p => `
                    <button onclick="app.selectProfile(${p.id})" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center justify-between ${store.activeProfileId === p.id ? 'bg-blue-50 text-primary font-bold' : 'text-slate-700'}">
                        <span>${p.name}</span>
                        ${store.activeProfileId === p.id ? '<i class="ph-bold ph-check"></i>' : ''}
                    </button>
                `).join('');

                // Settings Modal List
                DOM.savedProfilesList.innerHTML = store.profiles.map(p => `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg">
                        <div>
                            <div class="font-bold text-sm text-slate-800">${p.name}</div>
                            <div class="text-xs text-slate-500 font-mono">${p.model}</div>
                        </div>
                        <button onclick="app.deleteProfile(${p.id})" class="text-slate-400 hover:text-red-500 p-2"><i class="ph-bold ph-trash"></i></button>
                    </div>
                `).join('');
            },

            // --- CHAT LOGIC ---

            startNewChat: () => {
                const newChat = {
                    id: Date.now(),
                    title: 'নতুন আলোচনা',
                    messages: [],
                    timestamp: Date.now()
                };
                store.chats.unshift(newChat);
                app.loadChat(newChat.id);
                if(window.innerWidth < 768) toggleSidebar();
            },

            loadChat: (id) => {
                store.activeChatId = id;
                const chat = store.chats.find(c => c.id === id);
                if (!chat) return;

                DOM.chatContainer.innerHTML = '';
                
                if (chat.messages.length === 0) {
                    DOM.welcomeScreen.classList.remove('hidden');
                } else {
                    DOM.welcomeScreen.classList.add('hidden');
                    chat.messages.forEach(msg => ui.appendMessage(msg.role, msg.content));
                }
                
                ui.renderHistory();
                ui.scrollToBottom();
            },

            deleteChat: (e, id) => {
                e.stopPropagation(); // Prevent loading the chat when clicking delete
                if(confirm("এই চ্যাট হিস্ট্রি কি মুছে ফেলতে চান?")) {
                    store.chats = store.chats.filter(c => c.id !== id);
                    
                    // If deleted chat was active, switch to another or new
                    if (store.activeChatId === id) {
                        if(store.chats.length > 0) app.loadChat(store.chats[0].id);
                        else {
                             app.startNewChat(); 
                             DOM.welcomeScreen.classList.remove('hidden');
                        }
                    } else {
                        ui.renderHistory(); // Just re-render list
                    }
                    app.saveState();
                }
            },

            sendMessage: async () => {
                const text = DOM.input.value.trim();
                if (!text || store.isGenerating) return;
                
                const activeProfile = store.profiles.find(p => p.id === store.activeProfileId);
                if (!activeProfile) {
                    alert("দয়া করে সেটিংস থেকে একটি API সিলেক্ট করুন বা যোগ করুন।");
                    ui.openModal('settings-modal');
                    return;
                }

                // UI Updates
                DOM.input.value = '';
                DOM.input.style.height = 'auto';
                DOM.welcomeScreen.classList.add('hidden');
                store.isGenerating = true;
                DOM.sendBtn.disabled = true;

                const currentChat = store.chats.find(c => c.id === store.activeChatId);
                currentChat.messages.push({ role: 'user', content: text });
                
                if (currentChat.messages.length === 1) {
                    currentChat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
                }

                ui.appendMessage('user', text);
                app.saveState();

                // Create Placeholder
                const assistantMsgId = ui.appendMessage('assistant', '');
                const assistantContentDiv = document.getElementById(assistantMsgId);
                let fullResponse = "";

                try {
                    const response = await fetch(`${activeProfile.baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${activeProfile.key}`,
                            'HTTP-Referer': window.location.href,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: activeProfile.model,
                            messages: currentChat.messages, // Sends full context
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`API Error ${response.status}: ${errText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const content = data.choices[0]?.delta?.content || "";
                                    fullResponse += content;
                                    assistantContentDiv.innerHTML = marked.parse(fullResponse);
                                    ui.scrollToBottom();
                                } catch (err) { }
                            }
                        }
                    }

                    currentChat.messages.push({ role: 'assistant', content: fullResponse });
                    
                    // Highlight Code Blocks
                    assistantContentDiv.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                } catch (error) {
                    assistantContentDiv.innerHTML += `<div class="p-3 bg-red-50 text-red-600 rounded-lg text-sm mt-2 border border-red-200">⚠️ Error: ${error.message}</div>`;
                } finally {
                    store.isGenerating = false;
                    DOM.sendBtn.disabled = false;
                    app.saveState();
                }
            },
            
            clearChat: () => {
                const chat = store.chats.find(c => c.id === store.activeChatId);
                if(chat) {
                    chat.messages = [];
                    app.loadChat(chat.id);
                    app.saveState();
                }
            }
        };

        const ui = {
            renderHistory: () => {
                DOM.historyContainer.innerHTML = store.chats.map(chat => `
                    <div onclick="app.loadChat(${chat.id})" class="group flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all border border-transparent ${store.activeChatId === chat.id ? 'bg-white border-slate-200 shadow-sm text-primary' : 'text-slate-600 hover:bg-slate-100'}">
                        <i class="ph ${store.activeChatId === chat.id ? 'ph-chat-circle-dots' : 'ph-chat-circle'} text-lg"></i>
                        <div class="flex-1 truncate text-sm font-medium">${chat.title}</div>
                        <button onclick="app.deleteChat(event, ${chat.id})" class="text-slate-400 opacity-0 group-hover:opacity-100 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-all"><i class="ph-bold ph-trash"></i></button>
                    </div>
                `).join('');
            },

            appendMessage: (role, content) => {
                const uniqueId = 'msg-' + Date.now() + Math.random().toString(16).slice(2);
                const isUser = role === 'user';
                
                const html = `
                    <div class="flex gap-4 ${isUser ? 'flex-row-reverse' : ''} animate-message-pop group">
                        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center ${isUser ? 'bg-primary' : 'bg-white border border-slate-200'} shadow-sm z-10">
                            <i class="ph-bold ${isUser ? 'ph-user text-white' : 'ph-robot text-primary'}"></i>
                        </div>
                        <div class="max-w-[85%] md:max-w-[75%]">
                            <div class="prose prose-slate prose-sm ${isUser ? 'bg-primary text-white shadow-lg shadow-blue-500/20' : 'bg-white border border-slate-200 shadow-sm'} px-5 py-3.5 rounded-2xl ${isUser ? 'rounded-tr-sm' : 'rounded-tl-sm'} break-words">
                                <div id="${uniqueId}">${content ? marked.parse(content) : '<span class="loading-dots text-xl opacity-50"></span>'}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                DOM.chatContainer.insertAdjacentHTML('beforeend', html);
                return uniqueId;
            },

            scrollToBottom: () => {
                DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;
            },

            openModal: (id) => document.getElementById(id).classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id).classList.add('hidden')
        };

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        window.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
