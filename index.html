<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Nexus | AI Multi-Agent PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        surface: '#f8fafc',
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overflow: hidden; background: #ffffff; font-size: 13px; }
        .chat-height { height: calc(100vh - 180px); }
        .safe-area-inset { padding-bottom: max(1.2rem, env(safe-area-inset-bottom)); }
        
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-open { transform: translateX(0) !important; }

        /* Thought Box Style */
        .thought-container { transition: all 0.3s ease; max-height: 40px; overflow: hidden; cursor: pointer; }
        .thought-container.expanded { max-height: 500px; background: #f1f5f9; border-color: #cbd5e1; }
        
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-bubble { cursor: pointer; transition: opacity 0.2s; }
        .user-bubble:active { opacity: 0.7; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <header class="h-14 border-b border-slate-100 flex items-center justify-between px-4 sticky top-0 bg-white z-40">
        <button onclick="toggleSidebar()" class="p-2 text-slate-500"><i class="ph ph-list text-2xl"></i></button>
        <div class="text-center">
            <h1 class="font-black text-xs text-blue-600 tracking-tighter">NEXUS MULTI-CHAIN</h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase">Ultra Premium v2.0</p>
        </div>
        <button onclick="ui.openModal('settings-modal')" class="p-2 text-blue-600"><i class="ph ph-sliders text-2xl"></i></button>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-50 border-r border-slate-200 z-50 transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl lg:shadow-none flex flex-col">
            <div class="p-5 border-b bg-white flex items-center gap-3 cursor-pointer" onclick="ui.openModal('profile-modal')">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=Nexus+User&background=2563eb&color=fff" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover">
                <div class="flex-1">
                    <h3 id="display-name" class="font-bold text-sm">Nexus User</h3>
                    <p id="user-role" class="text-[10px] text-slate-400">System Architect</p>
                </div>
                <i class="ph ph-caret-right text-slate-300"></i>
            </div>

            <div class="p-4">
                <button onclick="app.newChat()" class="w-full py-3 bg-blue-600 text-white rounded-2xl text-xs font-bold shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                    <i class="ph ph-plus-circle"></i> New Session
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-4 space-y-2">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Memory Chains</p>
                <div class="text-center py-10 opacity-30">
                    <i class="ph ph-cloud-slash text-3xl"></i>
                    <p class="text-xs mt-2">Firebase not linked</p>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-white">
            <div id="chat-container" class="chat-height overflow-y-auto p-4 space-y-6 scroll-smooth">
                <div id="welcome" class="h-full flex flex-col items-center justify-center text-center opacity-60">
                    <i class="ph ph-sketch-logo text-5xl text-blue-600 mb-4"></i>
                    <h2 class="font-bold">Ready to Orchestrate</h2>
                    <p class="text-xs max-w-[200px] mt-1">Select an AI model and start your high-level command chain.</p>
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-100 safe-area-inset">
                <div class="max-w-4xl mx-auto space-y-2">
                    <div class="flex items-center gap-2 px-1">
                        <select id="api-selector" class="text-[10px] font-bold bg-slate-100 border-none rounded-lg px-2 py-1 outline-none text-slate-600 uppercase">
                            </select>
                        <span class="text-[9px] text-green-500 font-bold uppercase flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Neural Engine Active</span>
                    </div>

                    <div class="flex items-end gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2 focus-within:border-blue-400 transition-all">
                        <button onclick="document.getElementById('file-input').click()" class="p-2 text-slate-400 hover:text-blue-600"><i class="ph-bold ph-paperclip text-xl"></i></button>
                        <input type="file" id="file-input" class="hidden" multiple onchange="app.handleFiles(this)">
                        
                        <textarea id="user-input" rows="1" class="flex-1 bg-transparent border-none outline-none text-sm py-2 resize-none max-h-40" placeholder="Ask anything... (Long press my messages to edit)" oninput="autoResize(this)"></textarea>
                        
                        <button id="send-btn" onclick="app.sendMessage()" class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md active:scale-95 transition-transform">
                            <i class="ph-bold ph-paper-plane-right text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden animate-fade">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold">My Profile</h3>
                <button onclick="ui.closeModal('profile-modal')"><i class="ph ph-x"></i></button>
            </div>
            <div class="p-6 space-y-4 text-center">
                <div class="relative inline-block">
                    <img id="profile-img-preview" src="https://ui-avatars.com/api/?name=Nexus+User" class="w-20 h-20 rounded-full border-4 border-blue-50 object-cover mx-auto">
                    <button class="absolute bottom-0 right-0 bg-blue-600 text-white p-1.5 rounded-full border-2 border-white"><i class="ph ph-camera text-xs"></i></button>
                </div>
                <div class="space-y-3 text-left">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Avatar URL</label>
                        <input type="text" id="avatar-url-input" class="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:border-blue-500" placeholder="https://image.com/my-pic.jpg">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Full Name</label>
                        <input type="text" id="name-input" class="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-xs font-bold outline-none" value="Nexus User">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Role / Bio</label>
                        <input type="text" id="role-input" class="w-full mt-1 p-2.5 bg-slate-50 border rounded-xl text-xs outline-none" value="System Architect">
                    </div>
                </div>
                <div class="pt-4 space-y-2">
                    <button onclick="app.saveProfile()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-lg">Save Profile</button>
                    <button onclick="app.generateDevAPI()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs">Generate System API Key</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold">API Management</h3>
                <button onclick="ui.closeModal('settings-modal')"><i class="ph ph-x"></i></button>
            </div>
            <div id="api-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                </div>
            <div class="p-4 border-t bg-slate-50 flex gap-2">
                <button onclick="app.addAPI()" class="flex-1 py-3 border-2 border-dashed border-slate-300 rounded-xl text-xs font-bold text-slate-500">Add Model</button>
                <button onclick="ui.closeModal('settings-modal')" class="flex-1 py-3 bg-slate-900 text-white rounded-xl text-xs font-bold">Apply</button>
            </div>
        </div>
    </div>

    <script>
        // --- Core State ---
        let store = {
            user: { name: 'Nexus User', role: 'System Architect', avatar: 'https://ui-avatars.com/api/?name=Nexus+User&background=2563eb&color=fff' },
            apis: [
                { id: 1, name: 'GPT-4o Omni', key: '', provider: 'OpenAI' },
                { id: 2, name: 'Claude 3.5', key: '', provider: 'Anthropic' }
            ],
            editingId: null
        };

        const app = {
            init: () => {
                app.renderAPIs();
                app.updateUI();
            },

            updateUI: () => {
                document.getElementById('display-name').innerText = store.user.name;
                document.getElementById('user-role').innerText = store.user.role;
                document.getElementById('user-avatar').src = store.user.avatar;
                document.getElementById('profile-img-preview').src = store.user.avatar;
                
                const selector = document.getElementById('api-selector');
                selector.innerHTML = store.apis.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            },

            renderAPIs: () => {
                const container = document.getElementById('api-list');
                container.innerHTML = store.apis.map((api, i) => `
                    <div class="p-3 border rounded-2xl space-y-2">
                        <div class="flex justify-between items-center">
                            <input class="font-bold text-xs outline-none text-blue-600" value="${api.name}" onchange="store.apis[${i}].name=this.value">
                            <button onclick="app.removeAPI(${i})" class="text-red-400"><i class="ph ph-trash"></i></button>
                        </div>
                        <input type="password" placeholder="Paste API Key here..." class="w-full p-2 bg-slate-50 rounded-lg text-[10px] outline-none border focus:border-blue-400" value="${api.key}" onchange="store.apis[${i}].key=this.value">
                    </div>
                `).join('');
            },

            addAPI: () => {
                store.apis.push({ id: Date.now(), name: 'New AI Model', key: '', provider: 'Custom' });
                app.renderAPIs();
                app.updateUI();
            },

            removeAPI: (i) => {
                store.apis.splice(i, 1);
                app.renderAPIs();
                app.updateUI();
            },

            saveProfile: () => {
                store.user.name = document.getElementById('name-input').value;
                store.user.role = document.getElementById('role-input').value;
                const avatarInput = document.getElementById('avatar-url-input').value;
                if(avatarInput) store.user.avatar = avatarInput;
                
                app.updateUI();
                ui.closeModal('profile-modal');
            },

            generateDevAPI: () => {
                const key = 'nx-' + Math.random().toString(36).substr(2, 16).toUpperCase();
                alert(`Your System API Key Generated:\n\n${key}\n\nUse this to connect your website modules.`);
            },

            // --- Chat Logic ---
            sendMessage: async () => {
                const input = document.getElementById('user-input');
                const text = input.value.trim();
                if(!text) return;

                document.getElementById('welcome')?.classList.add('hidden');

                if(store.editingId) {
                    // Update existing message logic if needed, currently just appends new
                    ui.appendMsg('user', text + ' (Edited)');
                    store.editingId = null;
                } else {
                    ui.appendMsg('user', text);
                }

                input.value = '';
                input.style.height = 'auto';

                // AI Response Simulation
                const selectedApi = store.apis.find(a => a.id == document.getElementById('api-selector').value);
                
                // Show thinking then show main answer
                const botMsgId = ui.appendBotMsg(selectedApi.name);
                
                await new Promise(r => setTimeout(r, 2000)); // Simulate delay
                
                ui.updateBotMsg(botMsgId, 
                    "আপনার ইনপুটটি প্রসেস করা হয়েছে। ফায়ারবেস কানেকশন ছাড়া ডাটা ক্লাউডে যাবে না।", 
                    `🧠 প্রসেসিং ডাটা: ${selectedApi.name} এপিআই ব্যবহার করা হয়েছে। \nস্টেটাস: সাকসেসফুল। \nমেমোরি: লোকাল।`
                );
            },

            newChat: () => {
                document.getElementById('chat-container').innerHTML = '';
                app.updateUI();
                if(window.innerWidth < 1024) toggleSidebar();
            },

            handleEdit: (el) => {
                const oldText = el.querySelector('.msg-text').innerText;
                const input = document.getElementById('user-input');
                input.value = oldText;
                input.focus();
                store.editingId = Date.now();
                ui.showToast('এডিট মোড সক্রিয়');
            }
        };

        const ui = {
            openModal: (id) => document.getElementById(id).classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id).classList.add('hidden'),
            
            appendMsg: (role, text) => {
                const container = document.getElementById('chat-container');
                const div = document.createElement('div');
                div.className = `flex justify-end mb-4 animate-fade`;
                div.innerHTML = `
                    <div class="user-bubble bg-blue-600 text-white p-3 rounded-2xl rounded-tr-sm max-w-[85%] shadow-md" onclick="app.handleEdit(this)">
                        <p class="msg-text text-xs">${text}</p>
                    </div>
                `;
                container.appendChild(div);
                container.scrollTo(0, container.scrollHeight);
            },

            appendBotMsg: (aiName) => {
                const id = 'bot-' + Date.now();
                const container = document.getElementById('chat-container');
                const div = document.createElement('div');
                div.id = id;
                div.className = `flex flex-col mb-4 animate-fade`;
                div.innerHTML = `
                    <div class="max-w-[90%] space-y-2">
                        <span class="text-[9px] font-black text-blue-500 uppercase tracking-tighter ml-1">${aiName}</span>
                        <div class="thought-container border border-slate-200 bg-slate-50 p-2 rounded-xl text-[10px] text-slate-500 italic flex items-center gap-2" onclick="this.classList.toggle('expanded')">
                            <i class="ph ph-brain"></i>
                            <span class="thought-text">চিন্তা করছে... (ক্লিক করে দেখুন)</span>
                        </div>
                        <div class="main-answer bg-white border border-slate-100 p-3 rounded-2xl shadow-sm text-xs leading-relaxed">
                            <div class="h-2 w-10 bg-slate-200 animate-pulse rounded"></div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
                container.scrollTo(0, container.scrollHeight);
                return id;
            },

            updateBotMsg: (id, answer, thoughts) => {
                const el = document.getElementById(id);
                el.querySelector('.thought-text').innerText = thoughts;
                el.querySelector('.main-answer').innerHTML = marked.parse(answer);
            },

            showToast: (msg) => {
                const t = document.createElement('div');
                t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-[10px] z-[100] animate-bounce';
                t.innerText = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2000);
            }
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-open'); }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        app.init();
    </script>
</body>
</html>
