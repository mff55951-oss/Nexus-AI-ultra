<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Universal Chat Interface</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0f172a', // Slate 900
                        surface: '#1e293b',    // Slate 800
                        primary: '#3b82f6',    // Blue 500
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Markdown Styles */
        .prose pre { margin: 0; padding: 0; background: transparent; }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.875rem; }
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body class="bg-background text-slate-200 h-screen flex overflow-hidden font-sans selection:bg-primary selection:text-white">

    <aside id="sidebar" class="w-72 bg-slate-950 border-r border-slate-800 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0">
        <div class="p-4 flex items-center justify-between border-b border-slate-800/50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center shadow-lg shadow-blue-900/20">
                    <i class="ph-bold ph-brain text-white text-lg"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">Nexus<span class="text-primary font-normal">AI</span></span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
        </div>

        <div class="p-3">
            <button onclick="app.startNewChat()" class="w-full flex items-center gap-2 px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 rounded-xl transition-all group">
                <i class="ph-bold ph-plus text-primary group-hover:text-white transition-colors"></i>
                <span class="text-sm font-medium">New Workspace</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="history-container">
            </div>

        <div class="p-4 border-t border-slate-800 bg-slate-950/50">
            <button onclick="ui.openModal('settings-modal')" class="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                <i class="ph-duotone ph-gear-six text-xl"></i>
                <div class="text-left flex-1">
                    <div class="text-sm font-medium">Settings</div>
                    <div class="text-[10px] opacity-60">API Key & Models</div>
                </div>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full bg-background">
        
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-4 md:px-6 bg-background/80 backdrop-blur-md z-10 sticky top-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-800"><i class="ph ph-list text-2xl"></i></button>
                <div class="flex flex-col">
                    <span id="header-model-name" class="text-xs font-bold text-primary uppercase tracking-wider">GPT-3.5-TURBO</span>
                    <span class="text-[10px] text-slate-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Online</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="app.clearChat()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition-colors" title="Clear Context"><i class="ph ph-trash"></i></button>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center opacity-60">
                <i class="ph-duotone ph-planet text-6xl text-slate-600 mb-4"></i>
                <h2 class="text-xl font-semibold text-slate-300">Welcome to Nexus</h2>
                <p class="text-sm text-slate-500 mt-2">Configure your API key to start building.</p>
            </div>
            </div>

        <div class="p-4 md:p-6 bg-background border-t border-slate-800">
            <div class="max-w-4xl mx-auto relative bg-surface border border-slate-700 rounded-2xl shadow-xl shadow-black/20 focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
                <textarea id="user-input" rows="1" class="w-full bg-transparent text-sm md:text-base text-slate-200 placeholder-slate-500 px-4 py-4 pr-14 outline-none resize-none max-h-48" placeholder="Type a message..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                
                <button id="send-btn" onclick="app.sendMessage()" class="absolute right-2 bottom-2 p-2 bg-primary hover:bg-blue-600 text-white rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="ph-bold ph-paper-plane-right"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-[10px] text-slate-600">AI can make mistakes. Check important info.</p>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-surface border border-slate-700 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-white flex items-center gap-2"><i class="ph-bold ph-sliders"></i> Configuration</h3>
                <button onclick="ui.closeModal('settings-modal')" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">OpenRouter / OpenAI API Key</label>
                    <input type="password" id="setting-key" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-primary transition-colors" placeholder="sk-or-...">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Model ID</label>
                    <input type="text" id="setting-model" value="gpt-3.5-turbo" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-primary transition-colors" placeholder="e.g., google/gemini-pro">
                    <p class="text-[10px] text-slate-500 mt-1">Supports any OpenRouter model slug.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">System Instruction</label>
                    <textarea id="setting-prompt" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-primary resize-none">You are a helpful, expert AI assistant. Answer concisely and use Markdown.</textarea>
                </div>
            </div>
            <div class="p-4 bg-slate-900/50 border-t border-slate-700 flex justify-end gap-2">
                <button onclick="app.saveSettings()" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white text-sm font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all">Save Configuration</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * NEXUS SAAS - CLIENT SIDE LOGIC
         * Handles State, Persistence, UI Rendering, and API Streaming
         */

        const DOM = {
            input: document.getElementById('user-input'),
            chatContainer: document.getElementById('chat-container'),
            historyContainer: document.getElementById('history-container'),
            welcomeScreen: document.getElementById('welcome-screen'),
            headerModel: document.getElementById('header-model-name'),
            sendBtn: document.getElementById('send-btn')
        };

        // State Management
        const store = {
            config: {
                apiKey: '',
                model: 'gpt-3.5-turbo',
                systemPrompt: 'You are a helpful AI assistant.',
                baseUrl: 'https://openrouter.ai/api/v1' 
            },
            chats: [],
            activeChatId: null,
            isGenerating: false
        };

        // Application Logic
        const app = {
            init: () => {
                // Load from LocalStorage
                const savedConfig = localStorage.getItem('nexus_config');
                const savedChats = localStorage.getItem('nexus_chats');

                if (savedConfig) store.config = JSON.parse(savedConfig);
                if (savedChats) store.chats = JSON.parse(savedChats);

                // Populate Settings Inputs
                document.getElementById('setting-key').value = store.config.apiKey;
                document.getElementById('setting-model').value = store.config.model;
                document.getElementById('setting-prompt').value = store.config.systemPrompt;
                DOM.headerModel.innerText = store.config.model;

                // Render Sidebar
                ui.renderHistory();

                // Load latest chat or start new
                if (store.chats.length > 0) {
                    app.loadChat(store.chats[0].id);
                } else {
                    app.startNewChat();
                }

                // Input Event Listener for Enter key
                DOM.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        app.sendMessage();
                    }
                });

                if(!store.config.apiKey) ui.openModal('settings-modal');
            },

            saveState: () => {
                localStorage.setItem('nexus_config', JSON.stringify(store.config));
                localStorage.setItem('nexus_chats', JSON.stringify(store.chats));
                ui.renderHistory();
            },

            saveSettings: () => {
                store.config.apiKey = document.getElementById('setting-key').value.trim();
                store.config.model = document.getElementById('setting-model').value.trim();
                store.config.systemPrompt = document.getElementById('setting-prompt').value.trim();
                
                DOM.headerModel.innerText = store.config.model;
                app.saveState();
                ui.closeModal('settings-modal');
            },

            startNewChat: () => {
                const newChat = {
                    id: Date.now(),
                    title: 'New Conversation',
                    messages: [],
                    timestamp: Date.now()
                };
                store.chats.unshift(newChat);
                app.loadChat(newChat.id);
                if(window.innerWidth < 768) toggleSidebar();
            },

            loadChat: (id) => {
                store.activeChatId = id;
                const chat = store.chats.find(c => c.id === id);
                if (!chat) return;

                DOM.chatContainer.innerHTML = ''; // Clear view
                
                if (chat.messages.length === 0) {
                    DOM.welcomeScreen.classList.remove('hidden');
                } else {
                    DOM.welcomeScreen.classList.add('hidden');
                    chat.messages.forEach(msg => ui.appendMessage(msg.role, msg.content));
                }
                
                // Highlight active in sidebar
                ui.renderHistory();
                ui.scrollToBottom();
            },

            deleteChat: (e, id) => {
                e.stopPropagation();
                if(confirm("Delete this chat?")) {
                    store.chats = store.chats.filter(c => c.id !== id);
                    app.saveState();
                    if(store.chats.length > 0) app.loadChat(store.chats[0].id);
                    else app.startNewChat();
                }
            },

            sendMessage: async () => {
                const text = DOM.input.value.trim();
                if (!text || store.isGenerating) return;
                
                if (!store.config.apiKey) {
                    alert("Please enter your API Key in Settings.");
                    ui.openModal('settings-modal');
                    return;
                }

                // 1. UI Updates
                DOM.input.value = '';
                DOM.input.style.height = 'auto';
                DOM.welcomeScreen.classList.add('hidden');
                store.isGenerating = true;
                DOM.sendBtn.disabled = true;

                // 2. Add User Message
                const currentChat = store.chats.find(c => c.id === store.activeChatId);
                currentChat.messages.push({ role: 'user', content: text });
                
                // Auto-Title Logic
                if (currentChat.messages.length === 1) {
                    currentChat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
                }

                ui.appendMessage('user', text);
                app.saveState();

                // 3. Create Assistant Placeholder
                const assistantMsgId = ui.appendMessage('assistant', ''); // Returns ID of message div
                const assistantContentDiv = document.getElementById(assistantMsgId);
                let fullResponse = "";

                // 4. API Call (Streaming)
                try {
                    const response = await fetch(`${store.config.baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${store.config.apiKey}`,
                            'HTTP-Referer': window.location.href, // Required for OpenRouter
                            'X-Title': 'Nexus SaaS',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: store.config.model,
                            messages: [
                                { role: 'system', content: store.config.systemPrompt },
                                ...currentChat.messages
                            ],
                            stream: true
                        })
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const content = data.choices[0]?.delta?.content || "";
                                    fullResponse += content;
                                    
                                    // Live Render
                                    assistantContentDiv.innerHTML = marked.parse(fullResponse);
                                    ui.scrollToBottom();
                                } catch (err) { console.error('Parse error', err); }
                            }
                        }
                    }

                    // 5. Finalize
                    currentChat.messages.push({ role: 'assistant', content: fullResponse });
                    
                    // Apply Syntax Highlighting
                    assistantContentDiv.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                } catch (error) {
                    assistantContentDiv.innerHTML += `<br><span class="text-red-400 font-mono text-xs">[Error: ${error.message}]</span>`;
                } finally {
                    store.isGenerating = false;
                    DOM.sendBtn.disabled = false;
                    app.saveState();
                }
            },
            
            clearChat: () => {
                const chat = store.chats.find(c => c.id === store.activeChatId);
                if(chat) {
                    chat.messages = [];
                    app.loadChat(chat.id); // Reload to show empty state
                    app.saveState();
                }
            }
        };

        // UI Helpers
        const ui = {
            renderHistory: () => {
                DOM.historyContainer.innerHTML = store.chats.map(chat => `
                    <div onclick="app.loadChat(${chat.id})" class="group flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-all ${store.activeChatId === chat.id ? 'bg-primary/20 text-white border-l-2 border-primary' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}">
                        <i class="ph ph-chat-circle text-lg"></i>
                        <div class="flex-1 truncate text-sm font-medium">${chat.title}</div>
                        <button onclick="app.deleteChat(event, ${chat.id})" class="opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity"><i class="ph-bold ph-trash"></i></button>
                    </div>
                `).join('');
            },

            appendMessage: (role, content) => {
                const uniqueId = 'msg-' + Date.now() + Math.random().toString(16).slice(2);
                
                const isUser = role === 'user';
                const html = `
                    <div class="flex gap-4 ${isUser ? 'flex-row-reverse' : ''} animate-[slideIn_0.2s_ease-out]">
                        <div class="w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center ${isUser ? 'bg-primary' : 'bg-green-600'} text-white shadow-md">
                            <i class="ph-bold ${isUser ? 'ph-user' : 'ph-robot'}"></i>
                        </div>
                        <div class="max-w-[85%] md:max-w-[75%]">
                            <div class="prose prose-invert prose-sm ${isUser ? 'bg-primary text-white' : 'bg-surface border border-slate-700'} px-5 py-3.5 rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-sm break-words">
                                <div id="${uniqueId}">${content ? marked.parse(content) : '<span class="loading-dots text-xl"></span>'}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                DOM.chatContainer.insertAdjacentHTML('beforeend', html);
                return uniqueId;
            },

            scrollToBottom: () => {
                DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;
            },

            openModal: (id) => document.getElementById(id).classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id).classList.add('hidden')
        };

        // Helper for mobile sidebar
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            if (sb.classList.contains('-translate-x-full')) {
                sb.classList.remove('-translate-x-full');
            } else {
                sb.classList.add('-translate-x-full');
            }
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
