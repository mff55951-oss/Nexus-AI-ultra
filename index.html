<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pro | Advanced AI Client</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#f8fafc',
                        surface: '#ffffff',
                        primary: '#2563eb',
                        secondary: '#64748b',
                        danger: '#ef4444',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(10px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .prose pre { background: #f1f5f9; border-radius: 8px; padding: 1rem; margin: 0.5rem 0; overflow-x: auto; border: 1px solid #e2e8f0; }
        .prose code { color: #d946ef; font-family: 'Fira Code', monospace; font-size: 0.85em; }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body class="bg-background text-slate-800 h-screen flex overflow-hidden font-sans">

    <aside id="sidebar" class="w-80 bg-surface border-r border-slate-200 flex flex-col transition-transform duration-300 absolute md:relative z-30 h-full -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-xl text-slate-800">
                <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
                    <i class="ph-bold ph-lightning"></i>
                </div>
                Nexus<span class="text-primary">Pro</span>
            </div>
            <button onclick="Nexus.ui.toggleSidebar()" class="md:hidden text-slate-500"><i class="ph-bold ph-x"></i></button>
        </div>

        <div class="p-3">
            <button onclick="Nexus.chat.newChat()" class="w-full py-3 px-4 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl flex items-center gap-3 transition-all group shadow-sm">
                <i class="ph-bold ph-plus text-primary"></i>
                <span class="font-medium text-slate-700">New Chat</span>
            </button>
        </div>

        <div id="history-list" class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
            </div>

        <div class="p-3 border-t border-slate-100 bg-slate-50/50">
            <button onclick="Nexus.ui.openModal('settings-modal')" class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-white transition-colors text-slate-600">
                <i class="ph-duotone ph-gear-six text-xl"></i>
                <div class="text-left">
                    <div class="text-sm font-semibold">Settings & Keys</div>
                    <div class="text-[10px] text-slate-500">Manage Profiles</div>
                </div>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative w-full h-full bg-slate-50/50">
        
        <header class="h-16 bg-surface/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 md:px-6 z-20 sticky top-0">
            <div class="flex items-center gap-3">
                <button onclick="Nexus.ui.toggleSidebar()" class="md:hidden p-2 text-slate-500 rounded-lg hover:bg-slate-100"><i class="ph-bold ph-list text-xl"></i></button>
                
                <div class="relative group" id="api-selector-container">
                    <button onclick="document.getElementById('api-dropdown').classList.toggle('hidden')" class="flex items-center gap-2 bg-white border border-slate-200 px-3 py-1.5 rounded-full text-sm font-medium hover:border-primary transition-colors shadow-sm">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span id="header-model-name">Select Model</span>
                        <i class="ph-bold ph-caret-down text-xs text-slate-400"></i>
                    </button>
                    <div id="api-dropdown" class="hidden absolute top-full left-0 mt-2 w-64 bg-white border border-slate-200 rounded-xl shadow-xl py-1 z-50">
                        <div id="api-list" class="max-h-64 overflow-y-auto"></div>
                        <div class="border-t border-slate-100 mt-1 pt-1">
                            <button onclick="Nexus.ui.openModal('settings-modal'); document.getElementById('api-dropdown').classList.add('hidden')" class="w-full text-left px-4 py-2 text-xs font-bold text-primary hover:bg-slate-50 flex items-center gap-2">
                                <i class="ph-bold ph-plus-circle"></i> Add New Profile
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div id="token-display" class="hidden md:flex flex-col items-end mr-2">
                    <span class="text-[10px] font-mono text-slate-400">TOKENS</span>
                    <span class="text-xs font-bold text-slate-600" id="token-count">0</span>
                </div>
                <button onclick="Nexus.chat.clearContext()" class="p-2 text-slate-400 hover:text-red-500 rounded-lg transition-colors" title="Clear Conversation"><i class="ph-bold ph-trash"></i></button>
            </div>
        </header>

        <div id="chat-view" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
            <div id="welcome-state" class="h-full flex flex-col items-center justify-center opacity-60">
                <div class="w-24 h-24 bg-white rounded-2xl shadow-lg flex items-center justify-center mb-6 animate-pulse-slow">
                    <i class="ph-duotone ph-brain text-5xl text-primary"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Ready to Assist</h2>
                <p class="text-slate-500 mt-2">Select a profile and start building.</p>
            </div>
        </div>

        <div class="p-4 md:p-6 bg-surface border-t border-slate-200 relative">
            
            <div id="stop-btn-container" class="absolute -top-12 left-1/2 -translate-x-1/2 hidden">
                <button onclick="Nexus.chat.abortGeneration()" class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full shadow-lg text-sm font-semibold hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all">
                    <i class="ph-fill ph-stop-circle"></i> Stop Generating
                </button>
            </div>

            <div class="max-w-4xl mx-auto relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-purple-500/10 rounded-3xl blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative bg-slate-50 border border-slate-300 rounded-3xl shadow-sm focus-within:ring-2 focus-within:ring-primary/30 focus-within:border-primary transition-all flex flex-col">
                    <textarea id="user-input" rows="1" class="w-full bg-transparent text-base text-slate-800 placeholder-slate-400 px-5 py-4 pr-14 outline-none resize-none max-h-[400px]" placeholder="Type your message here..." oninput="Nexus.ui.autoResize(this)"></textarea>
                    
                    <div class="px-5 pb-2 flex justify-between items-center text-[10px] text-slate-400">
                        <span>Markdown Supported</span>
                        <span id="latency-meter">Lat: -ms</span>
                    </div>

                    <button id="send-btn" onclick="Nexus.chat.sendMessage()" class="absolute right-2 bottom-3 p-2.5 bg-primary hover:bg-blue-600 text-white rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                        <i class="ph-bold ph-paper-plane-right text-lg"></i>
                    </button>
                </div>
            </div>
            <div class="text-center mt-2 text-[10px] text-slate-400">
                Encrypted Local Storage • Client-Side Only
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-slide-up">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="ph-bold ph-sliders-horizontal"></i> Configuration</h3>
                <button onclick="Nexus.ui.closeModal('settings-modal')" class="text-slate-400 hover:text-slate-800"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            
            <div class="overflow-y-auto p-6 space-y-8">
                
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 space-y-4">
                    <h4 class="text-xs font-bold text-primary uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-plus"></i> Add Profile</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Name</label>
                            <input type="text" id="p-name" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="e.g. GPT-4 Turbo">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Provider Type</label>
                            <select id="p-provider" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none">
                                <option value="openai">OpenAI Compatible</option>
                                <option value="openrouter">OpenRouter</option>
                                <option value="anthropic">Anthropic (Coming Soon)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                         <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Model ID</label>
                            <input type="text" id="p-model" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="e.g. gpt-4-turbo">
                        </div>
                        <div>
                             <label class="block text-xs font-semibold text-slate-500 mb-1">Max Context (Msgs)</label>
                             <input type="number" id="p-context" value="10" min="2" max="50" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">API Key</label>
                        <input type="password" id="p-key" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="sk-...">
                    </div>
                    <div>
                         <label class="block text-xs font-semibold text-slate-500 mb-1">Base URL</label>
                         <input type="text" id="p-url" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-primary outline-none" placeholder="https://api.openai.com/v1">
                    </div>
                    <button onclick="Nexus.settings.addProfile()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold rounded-lg shadow-md transition-all">Save Profile</button>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Saved Profiles</h4>
                    <div id="settings-profile-list" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <i class="ph-bold ph-info"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        /**
         * NEXUS PRO - MODULAR ARCHITECTURE
         * Implements Module Pattern, Security Obfuscation, AbortController, and Smart Context.
         */
        const Nexus = (() => {
            
            // --- STATE ---
            const state = {
                profiles: [],
                chats: [],
                activeProfileId: null,
                activeChatId: null,
                abortController: null,
                isGenerating: false,
                startTime: 0
            };

            // --- UTILS (Security & Formatting) ---
            const Utils = {
                // Simple XOR + Base64 Obfuscation (Not military grade encryption, but prevents plain text reading)
                obfuscate: (text) => {
                    if (!text) return '';
                    const key = 'nexus-secure';
                    let result = '';
                    for (let i = 0; i < text.length; i++) {
                        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                    }
                    return btoa(result);
                },
                deobfuscate: (encoded) => {
                    if (!encoded) return '';
                    try {
                        const text = atob(encoded);
                        const key = 'nexus-secure';
                        let result = '';
                        for (let i = 0; i < text.length; i++) {
                            result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                        }
                        return result;
                    } catch (e) { return ''; }
                },
                generateId: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
                debounce: (func, wait) => {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => { clearTimeout(timeout); func(...args); };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                },
                estimateTokens: (text) => Math.ceil(text.length / 4) // Rough approximation
            };

            // --- DATA LAYER ---
            const Data = {
                save: () => {
                    // Encrypt profiles before saving
                    const safeProfiles = state.profiles.map(p => ({
                        ...p,
                        key: Utils.obfuscate(p.key) // Store obfuscated key
                    }));
                    
                    localStorage.setItem('nexus_profiles', JSON.stringify(safeProfiles));
                    // Don't encrypt chats for performance, unless requested
                    localStorage.setItem('nexus_chats', JSON.stringify(state.chats)); 
                    localStorage.setItem('nexus_meta', JSON.stringify({
                        activeProfileId: state.activeProfileId
                    }));
                },
                load: () => {
                    const profiles = JSON.parse(localStorage.getItem('nexus_profiles') || '[]');
                    state.profiles = profiles.map(p => ({
                        ...p,
                        key: Utils.deobfuscate(p.key) // Restore key to memory
                    }));
                    
                    state.chats = JSON.parse(localStorage.getItem('nexus_chats') || '[]');
                    const meta = JSON.parse(localStorage.getItem('nexus_meta') || '{}');
                    state.activeProfileId = meta.activeProfileId;

                    if (state.profiles.length > 0 && !state.profiles.find(p => p.id === state.activeProfileId)) {
                        state.activeProfileId = state.profiles[0].id;
                    }
                }
            };

            // --- UI RENDERER ---
            const UI = {
                dom: {
                    input: document.getElementById('user-input'),
                    chat: document.getElementById('chat-view'),
                    history: document.getElementById('history-list'),
                    welcome: document.getElementById('welcome-state'),
                    modelName: document.getElementById('header-model-name'),
                    apiList: document.getElementById('api-list'),
                    settingsList: document.getElementById('settings-profile-list'),
                    tokenCount: document.getElementById('token-count'),
                    latency: document.getElementById('latency-meter'),
                    stopBtn: document.getElementById('stop-btn-container')
                },

                toast: (msg, type = 'info') => {
                    const t = document.getElementById('toast');
                    const icon = t.querySelector('i');
                    document.getElementById('toast-msg').innerText = msg;
                    t.className = `fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-sm font-medium shadow-lg transform transition-all duration-300 z-50 flex items-center gap-2 ${type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'}`;
                    icon.className = type === 'error' ? 'ph-bold ph-warning-circle' : 'ph-bold ph-check-circle';
                    
                    t.classList.remove('translate-y-20', 'opacity-0');
                    setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
                },

                autoResize: (el) => {
                    el.style.height = 'auto';
                    el.style.height = el.scrollHeight + 'px';
                },

                scrollToBottom: Utils.debounce(() => {
                    const container = document.getElementById('chat-view');
                    container.scrollTop = container.scrollHeight;
                }, 50),

                renderHistory: () => {
                    UI.dom.history.innerHTML = state.chats.map(chat => `
                        <div onclick="Nexus.chat.load('${chat.id}')" class="group flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all border border-transparent ${state.activeChatId === chat.id ? 'bg-white border-slate-200 shadow-sm text-primary' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="ph ${state.activeChatId === chat.id ? 'ph-chat-circle-dots' : 'ph-chat-circle'} text-lg"></i>
                            <div class="flex-1 truncate text-sm font-medium">${chat.title}</div>
                            <button onclick="Nexus.chat.delete(event, '${chat.id}')" class="text-slate-400 opacity-0 group-hover:opacity-100 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-all"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    `).join('');
                },

                renderProfiles: () => {
                    const active = state.profiles.find(p => p.id === state.activeProfileId);
                    UI.dom.modelName.innerText = active ? active.name : "Select Model";
                    
                    // Header Dropdown
                    UI.dom.apiList.innerHTML = state.profiles.map(p => `
                        <button onclick="Nexus.settings.select('${p.id}')" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-50 flex items-center justify-between group ${state.activeProfileId === p.id ? 'text-primary bg-blue-50 font-semibold' : 'text-slate-700'}">
                            <div>
                                <div class="font-medium group-hover:text-primary transition-colors">${p.name}</div>
                                <div class="text-[10px] text-slate-400 font-mono">${p.model}</div>
                            </div>
                            ${state.activeProfileId === p.id ? '<i class="ph-bold ph-check"></i>' : ''}
                        </button>
                    `).join('');

                    // Settings List
                    UI.dom.settingsList.innerHTML = state.profiles.map(p => `
                        <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg">
                            <div>
                                <div class="font-bold text-sm text-slate-800">${p.name}</div>
                                <div class="text-xs text-slate-500 font-mono">${p.provider} • ${p.model}</div>
                            </div>
                            <button onclick="Nexus.settings.delete('${p.id}')" class="text-slate-400 hover:text-red-500 p-2"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    `).join('');
                },

                appendMessage: (role, content) => {
                    const id = 'msg-' + Utils.generateId();
                    const isUser = role === 'user';
                    
                    const html = `
                        <div class="flex gap-4 ${isUser ? 'flex-row-reverse' : ''} animate-slide-up group">
                            <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center ${isUser ? 'bg-primary' : 'bg-white border border-slate-200'} shadow-sm mt-1">
                                <i class="ph-bold ${isUser ? 'ph-user text-white' : 'ph-lightning text-primary'}"></i>
                            </div>
                            <div class="max-w-[85%] md:max-w-[75%]">
                                <div class="prose prose-slate prose-sm ${isUser ? 'bg-primary text-white shadow-lg shadow-blue-500/20' : 'bg-white border border-slate-200 shadow-sm'} px-5 py-3.5 rounded-2xl ${isUser ? 'rounded-tr-sm' : 'rounded-tl-sm'} break-words">
                                    <div id="${id}">${content ? marked.parse(content) : '<div class="typing-indicator flex gap-1"><span class="w-1.5 h-1.5 bg-slate-400 rounded-full"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full"></span><span class="w-1.5 h-1.5 bg-slate-400 rounded-full"></span></div>'}</div>
                                </div>
                                ${!isUser ? `<div class="text-[10px] text-slate-400 mt-1 ml-2 opacity-0 group-hover:opacity-100 transition-opacity">AI Generated</div>` : ''}
                            </div>
                        </div>
                    `;
                    UI.dom.chat.insertAdjacentHTML('beforeend', html);
                    return id;
                },

                toggleSidebar: () => document.getElementById('sidebar').classList.toggle('-translate-x-full'),
                openModal: (id) => document.getElementById(id).classList.remove('hidden'),
                closeModal: (id) => document.getElementById(id).classList.add('hidden')
            };

            // --- CORE LOGIC ---
            const Chat = {
                newChat: () => {
                    const chat = { id: Utils.generateId(), title: 'New Conversation', messages: [], timestamp: Date.now() };
                    state.chats.unshift(chat);
                    Chat.load(chat.id);
                    if(window.innerWidth < 768) UI.toggleSidebar();
                },
                
                load: (id) => {
                    state.activeChatId = id;
                    const chat = state.chats.find(c => c.id === id);
                    if(!chat) return;

                    UI.dom.chat.innerHTML = '';
                    if (chat.messages.length === 0) UI.dom.welcome.classList.remove('hidden');
                    else {
                        UI.dom.welcome.classList.add('hidden');
                        chat.messages.forEach(m => UI.appendMessage(m.role, m.content));
                    }
                    UI.renderHistory();
                    UI.scrollToBottom();
                },

                delete: (e, id) => {
                    e.stopPropagation();
                    if(confirm("Delete this chat permanently?")) {
                        state.chats = state.chats.filter(c => c.id !== id);
                        if(state.activeChatId === id) {
                            state.activeChatId = null;
                            state.chats.length > 0 ? Chat.load(state.chats[0].id) : (Chat.newChat(), UI.dom.welcome.classList.remove('hidden'));
                        } else {
                            UI.renderHistory();
                        }
                        Data.save();
                    }
                },
                
                clearContext: () => {
                     const chat = state.chats.find(c => c.id === state.activeChatId);
                     if(chat) {
                         chat.messages = [];
                         Chat.load(chat.id);
                         Data.save();
                     }
                },

                abortGeneration: () => {
                    if (state.abortController) {
                        state.abortController.abort();
                        state.abortController = null;
                        state.isGenerating = false;
                        UI.dom.stopBtn.classList.add('hidden');
                        document.getElementById('send-btn').disabled = false;
                        UI.toast("Generation stopped", "info");
                    }
                },

                sendMessage: async () => {
                    const text = UI.dom.input.value.trim();
                    if (!text || state.isGenerating) return;

                    const profile = state.profiles.find(p => p.id === state.activeProfileId);
                    if (!profile) return UI.toast("Please select a profile first", "error");

                    // 1. Prepare UI
                    UI.dom.input.value = '';
                    UI.dom.input.style.height = 'auto';
                    UI.dom.welcome.classList.add('hidden');
                    UI.dom.stopBtn.classList.remove('hidden');
                    document.getElementById('send-btn').disabled = true;
                    state.isGenerating = true;
                    state.startTime = Date.now();

                    // 2. Add User Message
                    const currentChat = state.chats.find(c => c.id === state.activeChatId);
                    currentChat.messages.push({ role: 'user', content: text });
                    if (currentChat.messages.length === 1) currentChat.title = text.slice(0, 30) + '...';
                    
                    UI.appendMessage('user', text);
                    const assistantMsgId = UI.appendMessage('assistant', null);
                    const msgDiv = document.getElementById(assistantMsgId);
                    
                    UI.renderHistory();
                    UI.scrollToBottom();

                    // 3. Smart Context Management (Slice history based on profile settings)
                    const limit = parseInt(profile.contextLimit) || 10;
                    const contextMessages = currentChat.messages.slice(-(limit + 1)); // Keep last N + current
                    
                    // Update Token Estimate
                    const estimatedTokens = contextMessages.reduce((acc, m) => acc + Utils.estimateTokens(m.content), 0);
                    UI.dom.tokenCount.innerText = `~${estimatedTokens}`;

                    // 4. API Call
                    state.abortController = new AbortController();
                    
                    try {
                        const response = await fetch(`${profile.baseUrl}/chat/completions`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${profile.key}`,
                                'HTTP-Referer': window.location.href,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                model: profile.model,
                                messages: contextMessages,
                                stream: true
                            }),
                            signal: state.abortController.signal
                        });

                        if (!response.ok) throw new Error(`API Error: ${response.status}`);

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let fullResponse = "";
                        let firstChunk = true;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');

                            for (const line of lines) {
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        const content = data.choices[0]?.delta?.content || "";
                                        fullResponse += content;
                                        
                                        if (firstChunk) {
                                            const latency = Date.now() - state.startTime;
                                            UI.dom.latency.innerText = `Lat: ${latency}ms`;
                                            firstChunk = false;
                                        }

                                        msgDiv.innerHTML = marked.parse(fullResponse);
                                        UI.scrollToBottom();
                                    } catch (e) {}
                                }
                            }
                        }

                        currentChat.messages.push({ role: 'assistant', content: fullResponse });
                        msgDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                        Data.save();

                    } catch (error) {
                        if (error.name !== 'AbortError') {
                            msgDiv.innerHTML = `<div class="text-red-500 bg-red-50 p-3 rounded-lg border border-red-200 text-xs">❌ Connection Error: ${error.message}</div>`;
                            UI.toast(error.message, 'error');
                        }
                    } finally {
                        state.isGenerating = false;
                        state.abortController = null;
                        UI.dom.stopBtn.classList.add('hidden');
                        document.getElementById('send-btn').disabled = false;
                    }
                }
            };

            // --- SETTINGS ---
            const Settings = {
                addProfile: () => {
                    const name = document.getElementById('p-name').value.trim();
                    const key = document.getElementById('p-key').value.trim();
                    const model = document.getElementById('p-model').value.trim();
                    const provider = document.getElementById('p-provider').value;
                    const context = document.getElementById('p-context').value;
                    let url = document.getElementById('p-url').value.trim();

                    if (!name || !key || !model) return UI.toast("Fill required fields", 'error');
                    if (!url) url = provider === 'openrouter' ? 'https://openrouter.ai/api/v1' : 'https://api.openai.com/v1';

                    const newProfile = { id: Utils.generateId(), name, key, model, provider, baseUrl: url, contextLimit: context };
                    state.profiles.push(newProfile);
                    state.activeProfileId = newProfile.id;
                    
                    // Clear form
                    ['p-name', 'p-key', 'p-model'].forEach(id => document.getElementById(id).value = '');
                    
                    Data.save();
                    UI.renderProfiles();
                    UI.toast("Profile Saved");
                },
                delete: (id) => {
                    if(!confirm("Remove this profile?")) return;
                    state.profiles = state.profiles.filter(p => p.id !== id);
                    if(state.activeProfileId === id) state.activeProfileId = state.profiles[0]?.id || null;
                    Data.save();
                    UI.renderProfiles();
                },
                select: (id) => {
                    state.activeProfileId = id;
                    Data.save();
                    UI.renderProfiles();
                    document.getElementById('api-dropdown').classList.add('hidden');
                }
            };

            // --- INIT ---
            const init = () => {
                Data.load();
                
                if (state.profiles.length === 0) UI.openModal('settings-modal');
                else UI.renderProfiles();

                if (state.chats.length === 0) Chat.newChat();
                else Chat.load(state.chats[0].id);

                // Event Listeners
                UI.dom.input.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Chat.sendMessage(); }
                });

                document.addEventListener('click', e => {
                    const dd = document.getElementById('api-dropdown');
                    const btn = document.getElementById('api-selector-container');
                    if (!btn.contains(e.target)) dd.classList.add('hidden');
                });
            };

            return { init, chat: Chat, settings: Settings, ui: UI };

        })();

        // Start App
        window.addEventListener('DOMContentLoaded', Nexus.init);

    </script>
</body>
</html>
