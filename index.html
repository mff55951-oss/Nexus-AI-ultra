<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Additional styles here if needed */
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="flex">
        <aside class="w-1/4 bg-white p-4 border-r">
            <h2 class="font-bold text-lg mb-4">Chat History</h2>
            <ul id="chat-history" class="overflow-y-auto max-h-96"></ul>
        </aside>
        <main class="flex-1 p-4">
            <div id="chat-ui" class="bg-white rounded-lg shadow p-4">
                <div id="messages" class="mb-4"></div>
                <textarea id="input" class="w-full border rounded p-2" rows="3" placeholder="Type your message..."></textarea>
                <button id="send" class="mt-2 bg-blue-500 text-white py-2 px-4 rounded">Send</button>
            </div>
            <button id="settings" class="mt-4 bg-gray-500 text-white py-2 px-4 rounded">Settings</button>
            <div id="settings-modal" class="hidden fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 flex items-center justify-center">
                <div class="bg-white p-4 rounded">
                    <h3 class="font-bold text-lg">Settings</h3>
                    <label for="api-key" class="block mt-2">OpenRouter API Key:</label>
                    <input type="text" id="api-key" class="border rounded w-full p-2" />
                    <label for="model-config" class="block mt-2">Model Configuration:</label>
                    <input type="text" id="model-config" class="border rounded w-full p-2" />
                    <button id="save-settings" class="mt-4 bg-green-500 text-white py-2 px-4 rounded">Save</button>
                    <button id="close-settings" class="mt-4 bg-red-500 text-white py-2 px-4 rounded">Close</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Retrieve stored chat history and settings
        const chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
        const apiKey = localStorage.getItem('apiKey');
        const modelConfig = localStorage.getItem('modelConfig');

        // Function to render messages
        function renderMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            chatHistory.forEach(chat => {
                const messageElem = document.createElement('div');
                messageElem.textContent = chat;
                messagesDiv.appendChild(messageElem);
            });
        }

        // Function to send a message
        document.getElementById('send').addEventListener('click', () => {
            const input = document.getElementById('input');
            const message = input.value;
            if (message.trim()) {
                chatHistory.push(message);
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
                renderMessages();
                input.value = '';
            }
        });

        // Settings functionality
        document.getElementById('settings').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.remove('hidden');
        });

        document.getElementById('close-settings').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('hidden');
        });

        document.getElementById('save-settings').addEventListener('click', () => {
            const apiKeyInput = document.getElementById('api-key').value;
            const modelConfigInput = document.getElementById('model-config').value;
            localStorage.setItem('apiKey', apiKeyInput);
            localStorage.setItem('modelConfig', modelConfigInput);
            document.getElementById('settings-modal').classList.add('hidden');
        });
        
        // Initialize chat
        renderMessages();
    </script>
</body>
</html>
