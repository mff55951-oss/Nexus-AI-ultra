<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus AI | Enterprise Interface</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', surface: '#f8fafc' }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overflow: hidden; background: #ffffff; font-size: 13px; }
        .chat-height { height: calc(100vh - 180px); }
        .safe-area-inset { padding-bottom: max(1.2rem, env(safe-area-inset-bottom)); }
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-open { transform: translateX(0) !important; }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* Markdown Styles */
        .prose p { margin-bottom: 0.5em; }
        .prose pre { background: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow-x: auto; }
        .prose code { font-family: monospace; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <header class="h-14 border-b border-slate-100 flex items-center justify-between px-4 sticky top-0 bg-white z-40">
        <button onclick="toggleSidebar()" class="p-2 text-slate-500"><i class="ph ph-list text-2xl"></i></button>
        <div class="text-center">
            <h1 class="font-black text-xs text-blue-600 tracking-tighter">NEXUS ENTERPRISE</h1>
            <p id="connection-status" class="text-[9px] text-green-500 font-bold uppercase">System Online</p>
        </div>
        <button onclick="ui.openModal('settings-modal')" class="p-2 text-blue-600"><i class="ph ph-sliders text-2xl"></i></button>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-50 border-r border-slate-200 z-50 transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl lg:shadow-none flex flex-col">
            <div class="p-5 border-b bg-white flex items-center gap-3 cursor-pointer" onclick="ui.openModal('profile-modal')">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=Admin&background=random" class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover">
                <div class="flex-1">
                    <h3 id="display-name" class="font-bold text-sm">Loading User...</h3>
                    <p id="user-email" class="text-[10px] text-slate-400">Connecting to Firebase...</p>
                </div>
            </div>

            <div class="p-4">
                <button onclick="app.newChat()" class="w-full py-3 bg-blue-600 text-white rounded-2xl text-xs font-bold shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                    <i class="ph ph-plus-circle"></i> New Session
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-4 space-y-2" id="chat-history-list">
                <p class="text-center text-xs text-slate-400 mt-10">Syncing History...</p>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-white">
            <div id="chat-container" class="chat-height overflow-y-auto p-4 space-y-6 scroll-smooth">
                <div id="welcome" class="h-full flex flex-col items-center justify-center text-center opacity-60">
                    <i class="ph ph-database text-5xl text-blue-600 mb-4"></i>
                    <h2 class="font-bold">Backend Connected</h2>
                    <p class="text-xs max-w-[200px] mt-1">Ready to process requests via Server.js & AI Service.</p>
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-100 safe-area-inset">
                <div class="max-w-4xl mx-auto space-y-2">
                    <div class="flex items-center gap-2 px-1">
                        <select id="model-selector" class="text-[10px] font-bold bg-slate-100 border-none rounded-lg px-2 py-1 outline-none text-slate-600 uppercase">
                            <option value="gpt-4">GPT-4 (Server)</option>
                            <option value="gemini-pro">Gemini Pro</option>
                            <option value="local-model">Local/Custom</option>
                        </select>
                    </div>

                    <div class="flex items-end gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2 focus-within:border-blue-400 transition-all">
                        <button onclick="document.getElementById('file-input').click()" class="p-2 text-slate-400 hover:text-blue-600"><i class="ph-bold ph-paperclip text-xl"></i></button>
                        <input type="file" id="file-input" class="hidden" multiple onchange="app.handleFileUpload(this)">
                        
                        <textarea id="user-input" rows="1" class="flex-1 bg-transparent border-none outline-none text-sm py-2 resize-none max-h-40" placeholder="Type command..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                        
                        <button onclick="app.sendMessage()" class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md active:scale-95 transition-transform">
                            <i class="ph-bold ph-paper-plane-right text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/firebase-service.js"></script>
    <script src="js/crypto-utils.js"></script>
    <script src="js/ai-service.js"></script>

    <script>
        // --- UI Helpers ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-open');
            sidebar.classList.toggle('-translate-x-full');
        }

        const ui = {
            openModal: (id) => document.getElementById(id)?.classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id)?.classList.add('hidden'),
            
            appendMsg: (role, text) => {
                const container = document.getElementById('chat-container');
                const isUser = role === 'user';
                
                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade`;
                
                div.innerHTML = `
                    <div class="${isUser ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-800'} 
                                max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm prose">
                        ${isUser ? text : marked.parse(text)}
                    </div>
                `;
                
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
                return div;
            }
        };

        // --- CORE APPLICATION LOGIC (Linking to your Backend) ---
        const app = {
            state: {
                user: null,
                currentChatId: null
            },

            init: async () => {
                console.log("Initializing Nexus System...");
                
                // 1. Firebase Authentication Check
                // (Assuming firebase-service.js has an auth listener)
                if (typeof checkAuthState === 'function') {
                    checkAuthState((user) => {
                        if (user) {
                            app.state.user = user;
                            document.getElementById('display-name').innerText = user.displayName || 'User';
                            document.getElementById('user-email').innerText = user.email;
                            app.loadHistory();
                        } else {
                            // Redirect to login or show login modal
                            console.log("No user logged in");
                        }
                    });
                }

                // 2. Load API Keys from Crypto Utils if needed
                if (typeof loadDecryptedKeys === 'function') {
                    loadDecryptedKeys(); 
                }
            },

            // Load Chat History from Firebase/Backend
            loadHistory: async () => {
                const listContainer = document.getElementById('chat-history-list');
                // ফায়ারবেস থেকে ডাটা আনার ডামি কল (আপনার পুরনো ফাংশন এখানে বসাতে হবে)
                // const history = await fetchChatHistory(app.state.user.uid); 
                
                // For now, clear loading text
                listContainer.innerHTML = ''; 
            },

            newChat: () => {
                app.state.currentChatId = Date.now().toString();
                document.getElementById('chat-container').innerHTML = '';
                document.getElementById('welcome').classList.remove('hidden');
                if(window.innerWidth < 1024) toggleSidebar();
            },

            // --- MAIN SEND FUNCTION ---
            sendMessage: async () => {
                const input = document.getElementById('user-input');
                const text = input.value.trim();
                const model = document.getElementById('model-selector').value;
                
                if(!text) return;

                // 1. UI Update
                document.getElementById('welcome')?.classList.add('hidden');
                ui.appendMsg('user', text);
                input.value = '';
                input.style.height = 'auto';

                // 2. Show "Thinking" State
                const loadingDiv = ui.appendMsg('ai', 'Thinking...');

                try {
                    let responseText = "";

                    // OPTION A: Call backend server directly (server.js)
                    // যদি আপনার server.js এ API Endpoint থাকে
                    /*
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, model: model })
                    });
                    const data = await res.json();
                    responseText = data.reply; 
                    */

                    // OPTION B: Call AI Service Logic (js/ai-service.js)
                    // যদি আপনি ক্লায়েন্ট সাইড থেকে হ্যান্ডেল করেন
                    if (typeof AIService !== 'undefined' && AIService.generateResponse) {
                        responseText = await AIService.generateResponse(text, model);
                    } else {
                        // Fallback if connection fails
                        console.warn("Backend not connected properly. Check console.");
                        // Simulate generic response for testing ONLY if backend fails
                        responseText = await fetch('http://localhost:3000/chat', { // Assuming local node server
                            method: 'POST', 
                            body: JSON.stringify({prompt: text}) 
                        }).then(r => r.json()).then(d => d.response).catch(e => "Error: Backend connection failed. Ensure server.js is running.");
                    }

                    // 3. Update UI with Real Data
                    loadingDiv.innerHTML = `<div class="bg-slate-100 text-slate-800 max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-sm prose">${marked.parse(responseText)}</div>`;

                } catch (error) {
                    console.error(error);
                    loadingDiv.innerHTML = `<div class="text-red-500">System Error: ${error.message}</div>`;
                }
            },

            handleFileUpload: async (input) => {
                const file = input.files[0];
                if (!file) return;
                
                ui.appendMsg('user', `📎 Uploading: ${file.name}...`);
                
                // Call your existing upload logic
                // await uploadFileToFirebase(file);
                
                ui.appendMsg('ai', `File ${file.name} received. Ready to analyze.`);
            }
        };

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
