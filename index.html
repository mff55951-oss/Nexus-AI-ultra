<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Nexus | Multi-API Mobile PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        surface: '#f3f4f6',
                        primary: '#2563eb',
                    }
                }
            }
        }
    </script>

    <style>
        /* Mobile Performance Fixes */
        body { -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .chat-height { height: calc(100vh - 160px); }
        @media (max-width: 768px) { .chat-height { height: calc(100vh - 140px); } }
        
        .safe-area-inset { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Smooth Sidebar */
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-open { transform: translateX(0) !important; }
        
        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar { width: 4px; }
        textarea::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        
        /* Glassmorphism & Animations */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        
        .agent-pill { 
            display: inline-flex; 
            align-items: center; 
            padding: 4px 12px; 
            border-radius: 9999px; 
            font-size: 11px; 
            font-weight: 700;
            border: 1px solid #e5e7eb;
            margin-right: 5px;
            white-space: nowrap;
        }
        .active-step { border-color: #2563eb; color: #2563eb; background: #eff6ff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-white text-slate-900 h-screen flex flex-col font-sans">

    <header class="h-14 border-b border-slate-200 flex items-center justify-between px-4 sticky top-0 bg-white z-40">
        <button onclick="toggleSidebar()" class="p-2 -ml-2 text-slate-600"><i class="ph ph-list text-2xl"></i></button>
        <div class="flex flex-col items-center">
            <span class="font-bold text-sm tracking-tight text-blue-600">NEXUS MULTI-CHAIN</span>
            <span id="device-label" class="text-[10px] text-slate-400 uppercase font-bold">Mobile Optimized</span>
        </div>
        <button onclick="ui.openModal('settings-modal')" class="p-2 -mr-2 text-blue-600"><i class="ph ph-gear-six text-2xl"></i></button>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-50 border-r border-slate-200 z-50 transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl lg:shadow-none flex flex-col">
            <div class="p-4 flex justify-between items-center lg:hidden border-b">
                <span class="font-bold">Menu</span>
                <button onclick="toggleSidebar()"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="p-4 border-b bg-white flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition" onclick="ui.openModal('profile-modal')">
                <div class="w-10 h-10 rounded-full bg-blue-100 border-2 border-blue-500 flex items-center justify-center text-blue-600 font-bold overflow-hidden" id="sidebar-avatar">
                    <i class="ph-bold ph-user text-xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-sm text-slate-800" id="sidebar-name">Nexus User</h3>
                    <p class="text-[10px] text-green-600 font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> Online</p>
                </div>
                <i class="ph ph-caret-right text-slate-400"></i>
            </div>

            <div class="p-4">
                <button onclick="app.newChat()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
                    <i class="ph-bold ph-plus"></i> New Session
                </button>
            </div>

            <div class="px-4 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">Saved API Chains</div>
            <div id="history-list" class="flex-1 overflow-y-auto px-2 pb-4"></div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-white">
            <div id="chat-container" class="chat-height overflow-y-auto p-4 space-y-4 scroll-smooth">
                <div id="welcome" class="h-full flex flex-col items-center justify-center text-center p-6">
                    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-4">
                        <i class="ph-bold ph-cpu text-3xl"></i>
                    </div>
                    <h1 class="text-xl font-bold text-slate-800">Ready to Orchestrate?</h1>
                    <p class="text-sm text-slate-500 mt-2">আপনার কথাটি নিচে লিখুন, অথবা ফাইল যুক্ত করুন। এপিআই ধাপে ধাপে এটি প্রসেস করবে।</p>
                </div>
            </div>

            <div id="active-pills" class="hidden px-4 py-2 flex gap-2 overflow-x-auto border-t bg-slate-50 shadow-inner"></div>

            <div id="attachment-preview" class="hidden px-4 py-2 bg-slate-50 border-t border-slate-100 flex gap-2 overflow-x-auto"></div>

            <div class="p-4 bg-white border-t border-slate-100 safe-area-inset">
                <div class="max-w-4xl mx-auto flex gap-2 items-end">
                    
                    <button onclick="document.getElementById('file-upload').click()" class="h-11 w-11 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center hover:bg-slate-200 transition-colors shrink-0">
                        <i class="ph-bold ph-paperclip text-xl"></i>
                    </button>
                    <input type="file" id="file-upload" class="hidden" multiple onchange="app.handleFiles(this)">

                    <div class="flex-1 bg-slate-100 rounded-2xl px-4 py-2 flex items-center border border-slate-200 focus-within:border-blue-500 transition-all">
                        <textarea id="user-input" rows="1" class="w-full bg-transparent border-none outline-none text-sm py-1 max-h-[40vh] overflow-y-auto resize-none" placeholder="আপনার প্রশ্ন বা কমান্ড লিখুন..." oninput="autoResize(this)"></textarea>
                    </div>

                    <button id="send-btn" onclick="app.startChain()" class="h-11 w-11 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md active:scale-95 transition-transform shrink-0">
                        <i class="ph-bold ph-paper-plane-right text-xl"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] flex items-end lg:items-center justify-center p-0 lg:p-4">
        <div class="bg-white w-full max-w-sm rounded-t-3xl lg:rounded-3xl shadow-2xl overflow-hidden transform transition-all">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">User Profile</h3>
                <button onclick="ui.closeModal('profile-modal')" class="p-2 bg-slate-200 rounded-full"><i class="ph ph-x"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div class="flex justify-center mb-4">
                    <div class="w-24 h-24 rounded-full bg-slate-100 border-4 border-blue-100 flex items-center justify-center text-blue-500 text-3xl relative">
                        <i class="ph-fill ph-user"></i>
                        <button class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full shadow-md"><i class="ph-bold ph-camera text-xs"></i></button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Display Name</label>
                    <input type="text" id="profile-name-input" value="Nexus User" class="w-full mt-1 p-3 bg-slate-50 border rounded-xl font-semibold outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Role / Title</label>
                    <input type="text" value="System Admin" class="w-full mt-1 p-3 bg-slate-50 border rounded-xl text-sm outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="p-4 border-t bg-slate-50">
                <button onclick="app.saveProfile()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold">Save Profile</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] flex items-end lg:items-center justify-center p-0 lg:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl lg:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50 sticky top-0 z-10">
                <h3 class="font-bold text-lg">API & Device Settings</h3>
                <button onclick="ui.closeModal('settings-modal')" class="p-2 bg-slate-200 rounded-full"><i class="ph ph-x"></i></button>
            </div>
            
            <div class="overflow-y-auto p-5 space-y-6">
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <label class="block text-xs font-bold text-blue-700 uppercase mb-2">Target Device Performance</label>
                    <select id="device-type" onchange="app.updateDevice()" class="w-full p-3 rounded-xl border-none shadow-sm text-sm font-semibold outline-none cursor-pointer">
                        <option value="mobile">📱 Mobile (Smooth Mode)</option>
                        <option value="pc">💻 PC (High Performance)</option>
                    </select>
                </div>

                <div class="flex justify-between items-end">
                    <h4 class="font-bold text-slate-700">API Chain Configuration</h4>
                    <span class="text-xs bg-slate-200 px-2 py-1 rounded-md text-slate-600 font-bold" id="api-count">0 APIs</span>
                </div>

                <div id="api-list-container" class="space-y-4">
                    </div>

                <button onclick="app.addMoreAPI()" class="w-full py-4 border-2 border-dashed border-slate-300 bg-slate-50 rounded-2xl text-slate-600 font-bold text-sm hover:border-blue-500 hover:text-blue-600 hover:bg-blue-50 transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-plus-circle text-lg"></i> Add New API Node
                </button>
            </div>

            <div class="p-4 border-t bg-slate-50 sticky bottom-0">
                <button onclick="app.saveSettings()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 transition-colors">Save Everything</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let store = {
            device: 'mobile',
            userName: 'Nexus User',
            attachments: [],
            apis: [
                { id: 0, name: 'Main Orchestrator', key: '', division: 'General Processing' },
                { id: 1, name: 'Text Analyst', key: '', division: 'Data Analysis' }
            ],
            divisions: ['General Processing', 'Text Generation', 'Image Processing', 'Data Analysis', 'Web Scraping', 'Final Review']
        };

        const app = {
            init: () => {
                const saved = localStorage.getItem('nexus_mobile_config_pro');
                if (saved) store = { ...store, ...JSON.parse(saved) };
                
                // Initialize UI
                document.getElementById('sidebar-name').innerText = store.userName;
                document.getElementById('profile-name-input').value = store.userName;
                
                app.renderAPISettings();
                app.updateDevice();
            },

            // --- API Configuration Logic ---
            renderAPISettings: () => {
                const container = document.getElementById('api-list-container');
                document.getElementById('api-count').innerText = `${store.apis.length} APIs`;
                
                container.innerHTML = store.apis.map((api, index) => `
                    <div class="p-4 bg-white border border-slate-200 shadow-sm rounded-2xl relative group transition-all focus-within:border-blue-400">
                        ${index > 0 ? `<button onclick="app.removeAPI(${index})" class="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity shadow-sm"><i class="ph-bold ph-x text-xs"></i></button>` : ''}
                        
                        <div class="flex flex-col gap-3">
                            <div class="flex justify-between items-center border-b pb-2">
                                <input type="text" value="${api.name}" onchange="app.updateAPIData(${index}, 'name', this.value)" 
                                    class="bg-transparent font-bold text-sm border-none outline-none text-blue-700 w-full" placeholder="API Node Name">
                            </div>
                            
                            <div class="grid grid-cols-1 gap-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Division / Role</label>
                                <select onchange="app.updateAPIData(${index}, 'division', this.value)" class="w-full p-2 text-sm bg-slate-50 border rounded-lg outline-none focus:border-blue-400 cursor-pointer">
                                    ${store.divisions.map(div => `<option value="${div}" ${api.division === div ? 'selected' : ''}>${div}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <input type="password" value="${api.key}" onchange="app.updateAPIData(${index}, 'key', this.value)"
                                    class="w-full p-2 text-sm border rounded-lg bg-slate-50 outline-none focus:border-blue-400 focus:bg-white transition-colors" placeholder="Paste API Key here...">
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            updateAPIData: (index, field, value) => {
                store.apis[index][field] = value;
            },

            addMoreAPI: () => {
                store.apis.push({ id: Date.now(), name: `Agent ${store.apis.length + 1}`, key: '', division: 'General Processing' });
                app.renderAPISettings();
                // Scroll to bottom of modal
                const modalBody = document.querySelector('#settings-modal .overflow-y-auto');
                setTimeout(() => modalBody.scrollTo(0, modalBody.scrollHeight), 50);
            },

            removeAPI: (index) => {
                store.apis.splice(index, 1);
                app.renderAPISettings();
            },

            saveSettings: () => {
                localStorage.setItem('nexus_mobile_config_pro', JSON.stringify({ device: store.device, apis: store.apis, userName: store.userName }));
                ui.closeModal('settings-modal');
            },

            saveProfile: () => {
                const name = document.getElementById('profile-name-input').value || 'Nexus User';
                store.userName = name;
                document.getElementById('sidebar-name').innerText = name;
                localStorage.setItem('nexus_mobile_config_pro', JSON.stringify({ device: store.device, apis: store.apis, userName: store.userName }));
                ui.closeModal('profile-modal');
            },

            updateDevice: () => {
                const type = document.getElementById('device-type').value;
                store.device = type;
                document.getElementById('device-label').innerText = type === 'mobile' ? 'Mobile Optimized' : 'Desktop Mode';
            },

            // --- File Upload Logic ---
            handleFiles: (input) => {
                const files = Array.from(input.files);
                if (files.length === 0) return;

                store.attachments = [...store.attachments, ...files];
                app.renderAttachmentPreview();
                input.value = ''; // Reset input
            },

            removeAttachment: (index) => {
                store.attachments.splice(index, 1);
                app.renderAttachmentPreview();
            },

            renderAttachmentPreview: () => {
                const container = document.getElementById('attachment-preview');
                if (store.attachments.length === 0) {
                    container.classList.add('hidden');
                    return;
                }
                
                container.classList.remove('hidden');
                container.innerHTML = store.attachments.map((file, index) => {
                    const isImage = file.type.startsWith('image/');
                    const isVideo = file.type.startsWith('video/');
                    let icon = 'ph-file';
                    if(isImage) icon = 'ph-image';
                    if(isVideo) icon = 'ph-video';

                    return `
                        <div class="relative flex items-center gap-2 bg-white border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-medium shadow-sm shrink-0">
                            <i class="ph ${icon} text-blue-500 text-lg"></i>
                            <span class="max-w-[80px] truncate">${file.name}</span>
                            <button onclick="app.removeAttachment(${index})" class="ml-1 text-slate-400 hover:text-red-500"><i class="ph-bold ph-x"></i></button>
                        </div>
                    `;
                }).join('');
            },

            // --- Chat & Chain Logic ---
            startChain: async () => {
                const inputEl = document.getElementById('user-input');
                const text = inputEl.value.trim();
                const hasFiles = store.attachments.length > 0;

                if (!text && !hasFiles) return;

                document.getElementById('welcome')?.classList.add('hidden');
                
                // Add user message to UI
                let userMsgContent = text;
                if(hasFiles) {
                    userMsgContent += `<br><div class="text-xs text-blue-200 mt-2 border-t border-blue-500/30 pt-1">📎 ${store.attachments.length} files attached</div>`;
                }
                ui.appendMsg('user', userMsgContent);
                
                // Reset Inputs
                inputEl.value = '';
                inputEl.style.height = 'auto';
                store.attachments = [];
                app.renderAttachmentPreview();
                
                // Setup Chain UI
                const pillContainer = document.getElementById('active-pills');
                pillContainer.classList.remove('hidden');
                pillContainer.innerHTML = store.apis.map(api => `
                    <span class="agent-pill" id="pill-${api.id}">
                        ${api.name} <span class="font-normal text-[9px] opacity-70 ml-1">(${api.division})</span>
                    </span>
                `).join('');

                let lastOutput = text || "Processing files...";

                // Chain Processing System with ERROR HANDLING
                try {
                    for (let i = 0; i < store.apis.length; i++) {
                        const api = store.apis[i];
                        const pill = document.getElementById(`pill-${api.id}`);
                        pill.classList.add('active-step');

                        // Simulate API Delay
                        await new Promise(r => setTimeout(r, 1200)); 

                        // ==========================================
                        // ERROR HANDLING SIMULATION (আপনার শর্ত অনুযায়ী)
                        // ==========================================
                        // যদি ইউজার "error" লেখে, বা কোনো কারণে সার্ভার ফেইল করে (এখানে আমি রেন্ডম 10% চান্স দিয়েছি ডেমোর জন্য)
                        const simulateError = text.toLowerCase() === 'error' || Math.random() < 0.10; 
                        
                        if (simulateError) {
                            throw new Error("Server malfunction"); // থ্রো করলে সোজা catch ব্লকে চলে যাবে
                        }

                        // Success Simulation
                        lastOutput = `[${api.division}]: ডেটা প্রসেস হয়েছে। ${lastOutput.substring(0, 30)}...`;

                        pill.classList.remove('active-step');
                        pill.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
                    }
                    
                    // Final Success Message
                    ui.appendMsg('bot', `**ফাইনাল রেজাল্ট:**\n\n${lastOutput}\n\n*সবগুলো এপিআই সফলভাবে কাজ সম্পন্ন করেছে।*`);

                } catch (error) {
                    // ==========================================
                    // EXACT ERROR MESSAGE (আপনার দেওয়া টেক্সট)
                    // ==========================================
                    ui.appendMsg('bot', 'আমি আপনার কাজটি করতে পারছিনা আমার সার্ভারে একটু সমস্যা হয়েছে।');
                    
                    // Error UI update
                    const activePills = document.querySelectorAll('.active-step');
                    activePills.forEach(p => {
                        p.classList.remove('active-step');
                        p.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
                    });
                } finally {
                    setTimeout(() => { pillContainer.classList.add('hidden'); }, 3000);
                }
            }
        };

        const ui = {
            openModal: (id) => document.getElementById(id).classList.remove('hidden'),
            closeModal: (id) => document.getElementById(id).classList.add('hidden'),
            appendMsg: (role, text) => {
                const container = document.getElementById('chat-container');
                const div = document.createElement('div');
                div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} mb-4 animate-fade-in`;
                
                // Styling based on role
                const bgClass = role === 'user' ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'bg-slate-100 text-slate-800 shadow-sm border border-slate-200';
                
                div.innerHTML = `
                    <div class="${bgClass} p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed overflow-hidden break-words">
                        ${marked.parse(text)}
                    </div>
                `;
                container.appendChild(div);
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            }
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-open');
        }

        // Auto Resize Textarea for Unlimited Input
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            // Limit height to avoid taking over the whole screen is handled by Tailwind class max-h-[40vh]
        }

        // Initialize App
        app.init();
    </script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
